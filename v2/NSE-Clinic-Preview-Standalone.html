 const t=i=>(words[language()]||words.en)[i],name=x=>x['name'+({ar:'Ar',en:'En',ur:'Ur',id:'Id'}[language()]||'En')]||x.nameEn||x.id;
 const button=(label,fn,sub=true)=>{const b=el('button',label,'btn'+(sub?' sub':''));b.type='button';b.onclick=fn;return b};
 function feedback(message,error=false){let n=host.querySelector('[data-clinic-feedback]');if(!n){n=el('p');n.dataset.clinicFeedback='';n.setAttribute('role','status');host.append(n)}n.className=error?'error':'clinic-feedback';n.textContent=message}

 async function load(){const stamp=++epoch,center=context().center;session=null;host.replaceChildren(el('p','…'));try{const d=await request('/api/clinic/setup?centerId='+encodeURIComponent(center));if(stamp!==epoch||center!==context().center)return;setup=d;renderSetup()}catch(e){if(stamp===epoch)host.replaceChildren(el('p',e.message==='FORBIDDEN'?t(41):e.message,'error'))}}
 function renderSetup(){host.replaceChildren();const heading=el('div',undefined,'clinic-heading');heading.append(el('h2',t(0)),el('span',t(1),'pill'));host.append(heading,el('p',t(16),'clinic-practice-note'));if(!setup.ready)host.append(el('p',t(17)+' '+setup.publishedCount+' / '+setup.requiredCount,'warning'));
  const controls=el('div',undefined,'clinic-controls'),label=el('label',undefined,'field'),select=el('select');label.append(el('span',t(7)),select);setup.procedures.forEach(p=>{const o=el('option',name(p));o.value=p.id;select.append(o)});controls.append(label);const start=preview=>perform(async()=>{const center=context().center,r=await post('/api/clinic/start',{procedureId:select.value,preview,mode:'guided'});if(center!==context().center)return;session=r;cursor=Math.min(r.step,4);renderSession()});if(setup.ready)controls.append(button(t(8),()=>start(false),false));if(setup.canPreview)controls.append(button(t(9),()=>start(true)));host.append(controls,el('p',t(48),'clinic-practice-note'));if(!setup.procedures.length)host.append(el('p','0 · '+t(7),'warning'));
  if(setup.canReview){const detail=el('details',undefined,'clinic-source'),summary=el('summary',t(21)),note=el('textarea'),confirm=el('label',undefined,'field'),check=el('input');check.type='checkbox';confirm.append(check,el('span',t(22)));note.setAttribute('aria-label',t(21));detail.append(summary,confirm,note,button(t(23),()=>perform(async()=>{await post('/api/clinic/review',{confirmed:check.checked,note:note.value});await load()})));host.append(detail)}
  if(setup.sessions.length){host.append(el('h3',t(47)));setup.sessions.forEach(s=>{const p=setup.procedures.find(p=>p.id===s.procedure_id);host.append(button((p?name(p):s.procedure_id)+' · '+s.step+'/5 · '+(s.preview?t(44):s.status==='completed'?t(15):t(14)),()=>perform(async()=>{const center=context().center;const r=await request('/api/clinic/session?centerId='+encodeURIComponent(center)+'&sessionId='+encodeURIComponent(s.id));if(center!==context().center)return;session=r;cursor=Math.min(session.step,4);renderSession()})))})}}
 function lesson(index){const m=session.lessons[index],lang=language(),tr=m.translations?.[lang]||m.translations?.en;const d=el('details',undefined,'clinic-source');d.append(el('summary',tr?.title||m.slug));if(!m.translations?.[lang]?.body)d.append(el('p',t(20),'warning'));d.append(el('p',tr?.body||'—','clinic-lesson'));return d}
 function renderSession(){host.replaceChildren();const heading=el('div',undefined,'clinic-heading');heading.append(el('h2',name(session.procedure)),el('span',session.preview?t(44):t(1),'pill'));host.append(heading);const stops=el('nav',undefined,'clinic-stops');stops.setAttribute('aria-label',t(0));for(let i=0;i<5;i++){const b=button((i<session.step?'✓ ':'')+t(i+2),()=>{cursor=i;renderSession()});b.disabled=i>session.step;b.classList.toggle('current',i===cursor);b.setAttribute('aria-current',i===cursor?'step':'false');stops.append(b)}host.append(stops);
 const workspace=el('div',undefined,'clinic-workspace'),room=el('div',undefined,'clinic-scene'),chair=el('div',undefined,'clinic-chair'),cabinet=el('div',undefined,'clinic-cabinet');chair.setAttribute('aria-hidden','true');cabinet.setAttribute('aria-hidden','true');room.append(el('span',t(0),'clinic-scene-label'),chair,cabinet);[['patient',2,0],['ipc',3,1],['tools',4,2],['flow',6,4]].forEach(([zone,label,idx])=>{const b=button(t(label),()=>{cursor=Math.min(idx,Math.min(session.step,4));renderSession()});b.classList.add('clinic-zone');b.dataset.zone=zone;room.append(b)});
 const task=el('section',undefined,'card');task.setAttribute('aria-label',t(cursor+2));task.append(el('span',t(24)+' · '+session.step+'/5','clinic-saved'),el('h3',t(cursor+2)),el('p',t(cursor+36),'clinic-dialogue'));

 else if(session.status!=='completed'){

 if(session.status==='completed')task.append(el('h3',t(15)),el('p',t(49),'clinic-feedback'));
 workspace.append(room,task);host.append(workspace);const footer=el('div',undefined,'clinic-footer');const prev=button(t(10),()=>{cursor--;renderSession()});prev.disabled=cursor===0;footer.append(prev,button(t(42),()=>load()));host.append(footer,el('p',t(16),'clinic-practice-note'));}
 async function act(payload){return perform(async()=>{const center=context().center,r=await post('/api/clinic/act',{sessionId:session.id,step:session.step,...payload});if(center!==context().center)return;session=r;if(r.accepted)cursor=Math.min(r.step,4);renderSession();feedback(t(r.accepted?26:25))})}
 return {load,reset(){epoch++;session=null;setup=null;host.replaceChildren()}};
};

const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const api=window.initClinicPractice({el,language:()=>language.value,context:()=>({center:'demo',role:'admin'}),request:async url=>url.includes('/setup')?{ready:false,canPreview:true,publishedCount:0,requiredCount:6,procedures:[p],sessions:saved?[{id:saved.id,step:saved.step,status:saved.status,preview:true,procedure_id:p.id}]:[]}:structuredClone(saved),post:async(route,b)=>{if(route.endsWith('/start')){saved=init();return structuredClone(saved)}if(route.endsWith('/act')){const accepted=b.step===2?JSON.stringify([...b.tools].sort())===JSON.stringify(['a','b']):b.action===['receive','prepare',null,'pause','handover'][b.step];saved.events.push({step:b.step,accepted});if(accepted)saved.step++;if(saved.step===5)saved.status='completed';return {...structuredClone(saved),accepted}}throw Error('Preview only')}});language.onchange=()=>{document.documentElement.lang=language.value;document.documentElement.dir=['ar','ur'].includes(language.value)?'rtl':'ltr';api.load()};document.getElementById('previewTheme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';api.load()})();
