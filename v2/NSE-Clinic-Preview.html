<!doctype html>
<html lang="ar" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NSE · Interactive clinic preview</title><link rel="stylesheet" href="/live-theme.css"><link rel="stylesheet" href="/design-21.css"><link rel="stylesheet" href="/clinic-practice.css"><style>body{margin:0;padding:clamp(14px,3vw,40px)}main{max-width:1200px;margin:auto}.preview-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}.preview-top label{display:flex;align-items:center;gap:8px}.preview-top select{max-width:180px;padding:10px;background:var(--nse-surface);color:var(--nse-ink);border:1px solid var(--nse-line);border-radius:10px}.preview-banner{padding:15px;background:var(--nse-soft);border-radius:12px;margin-bottom:20px;color:var(--nse-ink)}</style></head><body><main><header class="preview-top"><a class="brand" href="/">NSE</a><label>Language <select id="previewLanguage"><option value="ar">العربية</option><option value="en">English</option><option value="ur">اردو</option><option value="id">Indonesia</option></select></label><button class="btn sub" id="previewTheme">Light / Dark</button></header><p class="preview-banner">معاينة ببيانات وهمية · لا تحفظ في حسابك ولا تمنح نتيجة أو بطاقة. Fictional interface demo; no clinical instruction or credential.</p><section id="clinicRoot" class="clinic-shell"></section></main><script src="/clinic-practice.js"></script><script>
(()=>{'use strict';let saved=null;const language=document.getElementById('previewLanguage'),p={id:'demo-procedure',nameAr:'زيارة توضيحية — أدوات تجريبية',nameEn:'Demo visit — fictional tools',nameUr:'نمونہ ملاقات — فرضی آلات',nameId:'Kunjungan demo — alat fiktif'};
const lessons=Array.from({length:6},(_,i)=>({slug:'demo-source-'+i,version:1,translations:{ar:{title:'مصدر توضيحي '+(i+1),body:'هنا يظهر الدرس المعتمد المرتبط بهذه المحطة. هذا نص لمعاينة الشكل فقط، وليس تعليمات سريرية.'},en:{title:'Demo source '+(i+1),body:'The reviewed lesson for this station appears here. This is a visual placeholder, not clinical instruction.'},ur:{title:'نمونہ ماخذ '+(i+1),body:'یہاں منظور شدہ سبق دکھایا جائے گا۔ یہ صرف شکل کا نمونہ ہے، طبی ہدایت نہیں۔'},id:{title:'Sumber demo '+(i+1),body:'Pelajaran yang ditinjau muncul di sini. Ini contoh tampilan, bukan instruksi klinis.'}}}));
const init=()=>({id:'demo-session',step:0,status:'active',preview:true,procedure:p,lessons,tools:[{id:'a',nameAr:'أداة تجريبية أ',nameEn:'Fictional tool A'},{id:'b',nameAr:'أداة تجريبية ب',nameEn:'Fictional tool B'},{id:'c',nameAr:'عنصر إضافي تجريبي',nameEn:'Fictional extra item'}],events:[],awardsCompetency:false});
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const api=window.initClinicPractice({el,language:()=>language.value,context:()=>({center:'demo',role:'admin'}),request:async url=>url.includes('/setup')?{ready:false,canPreview:true,publishedCount:0,requiredCount:6,procedures:[p],sessions:saved?[{id:saved.id,step:saved.step,status:saved.status,preview:true,procedure_id:p.id}]:[]}:structuredClone(saved),post:async(route,b)=>{if(route.endsWith('/start')){saved=init();return structuredClone(saved)}if(route.endsWith('/act')){const accepted=b.step===2?JSON.stringify([...b.tools].sort())===JSON.stringify(['a','b']):b.action===['receive','prepare',null,'pause','handover'][b.step];saved.events.push({step:b.step,accepted});if(accepted)saved.step++;if(saved.step===5)saved.status='completed';return {...structuredClone(saved),accepted}}throw Error('Preview only')}});language.onchange=()=>{document.documentElement.lang=language.value;document.documentElement.dir=['ar','ur'].includes(language.value)?'rtl':'ltr';api.load()};document.getElementById('previewTheme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';api.load()})();
</script></body></html>
