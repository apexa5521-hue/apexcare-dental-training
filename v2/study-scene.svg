<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="A study desk: an open ruled notebook with highlighted notes, colour sticky notes and a dental instrument tray">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe4"/><stop offset="1" stop-color="#ebe5d6"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8c97a6"/><stop offset=".5" stop-color="#e3e8ee"/><stop offset="1" stop-color="#9aa5b3"/></linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe5ec"/><stop offset="1" stop-color="#c5ced9"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#3b3320" flood-opacity=".16"/></filter>
    <filter id="tiny" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#3b3320" flood-opacity=".18"/></filter>
  </defs>
  <rect width="560" height="360" rx="20" fill="url(#desk)"/>

  <!-- open notebook -->
  <g filter="url(#soft)" transform="rotate(-4 250 190)">
    <path d="M70 70 h170 q12 0 20 8 q8 -8 20 -8 h170 v230 h-170 q-12 0 -20 8 q-8 -8 -20 -8 h-170z" fill="#fffdf7"/>
    <g stroke="#9cc9e8" stroke-width="1.2">
      <path d="M86 108h158M86 132h158M86 156h158M86 180h158M86 204h158M86 228h158M86 252h158M86 276h158"/>
      <path d="M276 108h158M276 132h158M276 156h158M276 180h158M276 204h158M276 228h158M276 252h158M276 276h158"/>
    </g>
    <path d="M104 74v226" stroke="#f08a6c" stroke-width="2"/>
    <path d="M260 78v226" stroke="#e7dfcc" stroke-width="2"/>
    <!-- handwriting lines -->
    <g stroke="#2a3a5c" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M116 102h92"/><path d="M116 126h118"/><path d="M116 150h70"/>
      <path d="M116 198h104"/><path d="M116 222h84"/><path d="M116 246h112"/>
    </g>
    <!-- highlighter strokes -->
    <rect x="112" y="116" width="126" height="14" rx="3" fill="#ffd34d" opacity=".55"/>
    <rect x="112" y="236" width="84" height="14" rx="3" fill="#7fd6a0" opacity=".55"/>
    <!-- right page: a small labelled diagram of a tooth -->
    <path d="M318 120 q22 -18 44 0 q22 -18 44 0 q10 24 -4 52 q-6 38 -16 62 q-8 12 -14 -6 l-10 -36 l-10 36 q-6 18 -14 6 q-10 -24 -16 -62 q-14 -28 -4 -52z" fill="#ffffff" stroke="#2a3a5c" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M330 146 q32 14 64 0" fill="none" stroke="#e0552f" stroke-width="2.4" stroke-linecap="round"/>
    <g stroke="#2a3a5c" stroke-width="2" stroke-linecap="round"><path d="M412 140h20"/><path d="M402 206h30"/></g>
    <g stroke="#2a3a5c" stroke-width="3" stroke-linecap="round"><path d="M438 140h0"/></g>
    <!-- check marks -->
    <path d="M296 262 l8 8 l14 -16" fill="none" stroke="#2b9348" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M326 266h70" stroke="#2a3a5c" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- sticky notes -->
  <g filter="url(#tiny)">
    <rect x="404" y="34" width="86" height="80" rx="4" fill="#ffc94a" transform="rotate(6 447 74)"/>
    <rect x="452" y="96" width="78" height="72" rx="4" fill="#6cc3f0" transform="rotate(-7 491 132)"/>
    <rect x="28" y="40" width="70" height="66" rx="4" fill="#ff8fb1" transform="rotate(-8 63 73)"/>
  </g>
  <g stroke="#3b3320" stroke-opacity=".55" stroke-width="2.6" stroke-linecap="round">
    <path d="M420 62l46 4M418 80l34 3" transform="rotate(6 447 74)"/>
    <path d="M466 124l42 -4M468 140l28 -2" transform="rotate(-7 491 132)"/>
    <path d="M42 66l36 -4M44 82l24 -3" transform="rotate(-8 63 73)"/>
  </g>

  <!-- instrument tray -->
  <g filter="url(#soft)" transform="rotate(3 450 280)">
    <rect x="356" y="236" width="188" height="96" rx="14" fill="url(#tray)"/>
    <rect x="364" y="244" width="172" height="80" rx="10" fill="#eef2f6"/>
    <!-- mouth mirror -->
    <rect x="378" y="262" width="104" height="6" rx="3" fill="url(#steel)"/>
    <circle cx="494" cy="265" r="12" fill="#cfe7f7" stroke="#8c97a6" stroke-width="3"/>
    <!-- explorer -->
    <rect x="378" y="284" width="118" height="5" rx="2.5" fill="url(#steel)"/>
    <path d="M496 286 q14 -2 18 -12" fill="none" stroke="#8c97a6" stroke-width="3" stroke-linecap="round"/>
    <!-- cotton pliers -->
    <path d="M378 306 L512 300 M378 310 L512 306" stroke="#8c97a6" stroke-width="3.4" stroke-linecap="round"/>
    <!-- colour coding bands -->
    <rect x="392" y="261" width="10" height="8" rx="2" fill="#0a84c6"/>
    <rect x="392" y="283" width="10" height="7" rx="2" fill="#e0552f"/>
    <rect x="392" y="304" width="10" height="8" rx="2" fill="#2b9348"/>
  </g>

  <!-- highlighter pen -->
  <g filter="url(#tiny)" transform="rotate(-28 170 318)">
    <rect x="100" y="306" width="120" height="22" rx="8" fill="#ffd34d"/>
    <rect x="100" y="306" width="36" height="22" rx="8" fill="#2a3a5c"/>
    <path d="M220 309 l18 4 v6 l-18 4z" fill="#e6b52c"/>
  </g>
  <!-- pencil -->
  <g filter="url(#tiny)" transform="rotate(12 300 330)">
    <rect x="236" y="324" width="110" height="10" rx="2" fill="#e0552f"/>
    <path d="M346 324 l18 5 l-18 5z" fill="#f3d7b0"/><path d="M358 327.5 l6 1.5 l-6 1.5z" fill="#2a3a5c"/>
    <rect x="228" y="324" width="10" height="10" rx="2" fill="#ff8fb1"/>
  </g>
</svg>
