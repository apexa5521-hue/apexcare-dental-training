moduleId":"five_moments","textAr":"اللحظة 3️⃣ — بعد التعرض لسوائل الجسم (دم، لعاب، إفرازات)","textEn":"Moment 3️⃣ — AFTER body fluid exposure risk (blood, saliva, secretions)"},{"id":"fm4","moduleId":"five_moments","textAr":"اللحظة 4️⃣ — بعد لمس المريض","textEn":"Moment 4️⃣ — AFTER touching a patient"},{"id":"fm5","moduleId":"five_moments","textAr":"اللحظة 5️⃣ — بعد لمس محيط المريض حتى بدون لمسه مباشرة","textEn":"Moment 5️⃣ — AFTER touching patient surroundings (even without direct patient contact)"},{"id":"fm6","moduleId":"five_moments","textAr":"📌 في طب الأسنان: القفازات لا تُغني أبداً عن نظافة اليدين","textEn":"📌 In dentistry: Gloves NEVER replace hand hygiene — always perform both"}]},{"id":"sterilization","nameAr":"التعقيم ومكافحة العدوى","nameEn":"Sterilization & Infection Control","icon":"🔬","color":"#8b5cf6","steps":[{"id":"sr1","moduleId":"sterilization","textAr":"📦 مستويات المعالجة: تعقيم كامل ← مستوى عالٍ ← متوسط ← منخفض","textEn":"📦 Processing levels: Full Sterilization → High → Intermediate → Low-level disinfection"},{"id":"sr2","moduleId":"sterilization","textAr":"🔧 الأدوات الحيوية (مبارد، كاشطات، شنبر): أوتوكليف Class B — 134°C / 18 دقيقة","textEn":"🔧 Critical instruments (files, curettes, handpiece): Class B Autoclave — 134°C / 18 min"},{"id":"sr3","moduleId":"sterilization","textAr":"🧹 الأسطح والوحدة: تطهير بكحول 70% أو هايبوكلوريت 0.5% بعد كل مريض","textEn":"🧹 Surfaces and dental unit: disinfect with 70% alcohol or 0.5% hypochlorite after each patient"},{"id":"sr4","moduleId":"sterilization","textAr":"🛡 الحواجز الواقية: تغطية الأزرار والخراطيم بالبلاستيك وتغييرها بين كل مريض","textEn":"🛡 Barriers: plastic-wrap buttons and tubing, change between every patient"},{"id":"sr5","moduleId":"sterilization","textAr":"📋 التتبع: ترقيم الحزم + مؤشرات كيميائية مع كل دفعة + اختبار جراثيم أسبوعياً","textEn":"📋 Tracking: package numbering + chemical indicators every load + weekly spore test"},{"id":"sr6","moduleId":"sterilization","textAr":"🗑 الأدوات الحادة: حاويا علاج","قوى خفيفة مستمرة للمحاذاة الأولية","إغلاق فراغات الخلع","تثبيت البراكيت"],"optionsEn":["Post-treatment retention","Light continuous forces for initial tooth alignment","Close extraction spaces","Bond brackets"],"answer":1}],"pedo":[{"id":"q_pd1","groupId":"pedo","questionAr":"متى يُشار إلى SSC (التاج المعدني) لأسنان الأطفال؟","questionEn":"When is Stainless Steel Crown (SSC) indicated for primary teeth?","optionsAr":["للتجميل فقط","عند وجود تسوس واسع أو بعد علاج اللب","لحفظ المسافة فقط","للتقويم فقط"],"optionsEn":["Cosmetics only","Extensive caries or after pulp therapy","Space maintenance only","Orthodontics only"],"answer":1}],"prostho":[{"id":"q_pr1","groupId":"prostho","questionAr":"ما الغرض من Retraction Cord قبل أخذ طبعة التاج؟","questionEn":"What is the purpose of retraction cord before crown impression?","optionsAr":["تخدير اللثة","إبعاد اللثة للحصول على طبعة دقيقة لحدود التاج","تلميع الأسنان","إزالة الجير"],"optionsEn":["Anesthetize gingiva","Displace gingiva for accurate crown margin impression","Polish teeth","Remove calculus"],"answer":1}],"ipc_donning":[{"id":"q_dn1","groupId":"ipc_donning","questionAr":"ما التسلسل الصحيح لارتداء معدات الوقاية؟","questionEn":"What is the correct sequence for donning PPE?","optionsAr":["قفازات ← كمامة ← جاون ← يدان","يدان ← جاون ← كمامة ← نظارة ← قفازات","كمامة ← نظارة ← يدان ← جاون","جاون ← قفازات ← كمامة ← يدان"],"optionsEn":["Gloves → Mask → Gown → Hands","Hands → Gown → Mask → Eye protection → Gloves","Mask → Eye prot. → Hands → Gown","Gown → Gloves → Mask → Hands"],"answer":1}],"ipc_sterilization":[{"id":"q_sr1","groupId":"ipc_sterilization","questionAr":"ما درجة الحرارة والوقت الصحيحان لأوتوكليف Class B؟","questionEn":"What are the correct parameters for Class B autoclave sterilization?","optionsAr":["121°C / 30 دقيقة","134°C / 18 دقيقة","100°C / 60 دقيقة","150°C / 5 دقائق"],"optionsEn":["121°C / 30 minutes","134°C / 18 minutes","100°C / 60 minutes","150°C / 5 minutes"],"answer":1}],"ipc_five_moments":[{"id":"q_fm1","groupId":"ipc_five_moments","questionAr":"هل ارتداء القفازات يُغني عن نظافة اليدين في طب الأسنان؟","questionEn":"Do gloves replace hand hygiene in dental practice?","optionsAr":["نعم دائماً","نعم إذا كانت طبقتين","لا — نظافة اليدين إلزامية قبل وبعد القفازات","فقط للإجراءات الجراحية"],"optionsEn":["Yes always","Yes if double-gloved","No — hand hygiene is mandatory before and after gloving","Only for surgical procedures"],"answer":2}]},"users":[{"id":"u1","username":"admin","password":"admin123","name":"Mr. Ibrahim Alluhaydi","role":"admin"},{"id":"u2","username":"nurse1","password":"1234","name":"سارة أحمد","role":"nurse"},{"id":"u3","username":"nurse2","password":"1234","name":"نورة العتيبي","role":"nurse"}]}

<script>
window.__SEED = JSON.parse(document.getElementById("seed-data").textContent);
</script>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ══════════════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════════════
const GAS_URL = "https://script.google.com/macros/s/AKfycbzTpfT_7nUaePQ5-T09i8FEevVOzoEiXfqOMWjXOdrLgk-vLM4W58hLBi-K9V3JxO-mBw/exec";
const GAS_OK  = () => !GAS_URL.includes("YOUR_DEPLOYMENT_ID");

// ══════════════════════════════════════════════════════
//  SEED DATA
// ══════════════════════════════════════════════════════
// SEED loaded from window.__SEED
const SEED = window.__SEED;
const gid  = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const deep = x  => JSON.parse(JSON.stringify(x));

async function api(action, params={}, token=null) {
  if (!GAS_OK()) throw new Error("GAS_NOT_CONFIGURED");
  const body = { action, ...params, ...(token ? {token} : {}) };
  const res  = await fetch(GAS_URL, { method:"POST", body:JSON.stringify(body), headers:{"Content-Type":"text/plain"} });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "api_error");
  return json;
}

// ══════════════════════════════════════════════════════
//  APP ROOT
// ══════════════════════════════════════════════════════
function App() {
  const [lang,  setLang]  = useState("ar");
  const [db,    setDb]    = useState(deep(SEED));
  const [user,  setUser]  = useState(null);
  const [token, setToken] = useState(null);
  const [sync,  setSync]  = useState("offline");
  const [toast, setToast] = useState(null);

  const t = (ar, en) => lang === "ar" ? ar : en;

  // إخفاء شاشة التحميل بعد أول render
  useEffect(() => {
    const el = document.getElementById('loading');
    if (el) el.style.display = 'none';
  }, []);

  const toastFn = useCallback((msg, type="ok") => {
    setToast({msg, type});
    setTimeout(() => setToast(null), 3000);
  }, []);

  const syncAll = async (tk) => {
    setSync("syncing");
    try {
      const r = await api("getAll", {}, tk || token);
      const q = {};
      Object.entries(r.data.quizzes||{}).forEach(([k,arr]) => {
        q[k] = arr.map(x => ({...x,
          optionsAr: typeof x.optionsAr==="string" ? JSON.parse(x.optionsAr||"[]") : (x.optionsAr||[]),
          optionsEn: typeof x.optionsEn==="string" ? JSON.parse(x.optionsEn||"[]") : (x.optionsEn||[]),
          answer: parseInt(x.answer)||0,
        }));
      });
      // ── Only replace if GAS has COMPLETE data (with tools) — otherwise keep SEED
      setDb(d => {
        // Check if GAS specs have tools loaded
        const gasSpecs = r.data.specialties || [];
        const gasHasTools = gasSpecs.some(s => (s.tools||[]).length > 0);
        const gasHasSteps = (r.data.ipcModules||[]).some(m => (m.steps||[]).length > 0);

        const specs   = (gasSpecs.length > 0 && gasHasTools) ? gasSpecs : d.specialties;
        const ipcs    = ((r.data.ipcModules||[]).length > 0 && gasHasSteps) ? r.data.ipcModules : d.ipcModules;
        const quizzes = Object.keys(q).length > 0 ? q : d.quizzes;

        return {...d, specialties:specs, ipcModules:ipcs, quizzes};
      });
      setSync("ok");
    } catch { setSync("error"); }
  };

  useEffect(() => {
    if (GAS_OK()) {
      // Just ping to check connection — don't sync without token
      fetch(GAS_URL, { method:"POST", body:JSON.stringify({action:"ping"}), headers:{"Content-Type":"text/plain"} })
        .then(r => r.json())
        .then(d => { if(d.ok) setSync("ok"); })
        .catch(() => setSync("error"));
    }
  }, []);

  const doLogin = async (u, p) => {
    if (GAS_OK()) {
      setSync("syncing");
      try {
        const r = await api("login", {username:u, password:p});
        setUser(r.user); setToken(r.token);
        await syncAll(r.token);
        return r.user;
      } catch { setSync("error"); }
    }
    const found = db.users.find(x => x.username===u && x.password===p);
    if (found) { setUser(found); return found; }
    return null;
  };

  const doLogout = () => { setUser(null); setToken(null); };

  // Optimistic mutation
  const mut = async (gasAction, gasParams, localFn) => {
    setDb(d => { const n=deep(d); localFn(n); return n; });
    if (GAS_OK() && token) {
      setSync("syncing");
      try { await api(gasAction, gasParams, token); setSync("ok"); }
      catch { setSync("error"); toastFn(t("فشل الحفظ في الخادم","Server save failed"), "err"); }
    }
  };

  if (!user) return (
    <LoginScreen lang={lang} setLang={setLang} sync={sync} onLogin={doLogin} toast={toast} />
  );

  if (user.role === "admin") return (
    <AdminPortal key={lang} lang={lang} setLang={setLang} db={db} user={user} token={token}
      sync={sync} syncAll={syncAll} toast={toast} toastFn={toastFn}
      mut={mut} onLogout={doLogout} />
  );

  return (
    <NursePortal key={lang} lang={lang} setLang={setLang} db={db} user={user}
      sync={sync} syncAll={syncAll} token={token} toast={toast} toastFn={toastFn}
      onLogout={doLogout} />
  );
}

// ══════════════════════════════════════════════════════
//  SHARED: DESIGN TOKENS
// ══════════════════════════════════════════════════════
const V = {
  hi:"#3b82f6", pur:"#6366f1", grn:"#10b981", red:"#ef4444",
  org:"#f97316", yel:"#f59e0b", pink:"#ec4899", muted:"#64748b",
  txt:"#1e293b",
};

// ══════════════════════════════════════════════════════
//  LOGIN SCREEN
// ══════════════════════════════════════════════════════
function LoginScreen({ lang, setLang, sync, onLogin, toast }) {
  const t = (ar, en) => lang === "ar" ? ar : en;
  const [u, setU] = useState("");
  const [p, setP] = useState("");
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);
  const dir = lang==="ar"?"rtl":"ltr";

  const S = {
    wrap:  { direction:dir, fontFamily:lang==="ar"?"'Tajawal',sans-serif":"'Inter',sans-serif", minHeight:"100vh", background:"linear-gradient(150deg,#020812 0%,#060e22 60%,#040b1a 100%)", display:"flex", alignItems:"center", justifyContent:"center", padding:20 },
    box:   { width:"100%", maxWidth:400 },
    card:  { background:"#ffffff", border:"1px solid rgba(0,0,0,0.08)", borderRadius:16, padding:28 },
    inp:   { background:"#f8fafc", border:"1px solid #e2e8f0", borderRadius:9, padding:"10px 14px", color:"#1e293b", fontSize:14, width:"100%", boxSizing:"border-box", outline:"none", fontFamily:"inherit" },
    lbl:   { fontSize:12, color:V.muted, marginBottom:4, display:"block", fontWeight:700 },
    pri:   { padding:"11px 20px", borderRadius:10, border:"none", cursor:"pointer", fontWeight:800, fontSize:14, background:"linear-gradient(135deg,#38bdf8,#6366f1)", color:"#fff", width:"100%", fontFamily:"inherit" },
    toast: (tp) => ({ position:"fixed", top:18, [dir==="rtl"?"right":"left"]:18, padding:"10px 16px", borderRadius:10, zIndex:999, fontWeight:700, fontSize:13, fontFamily:"inherit", background:tp==="ok"?"rgba(16,185,129,0.94)":"rgba(239,68,68,0.94)", color:"#fff" }),
  };

  const submit = async () => {
    if (!u || !p) return;
    setLoading(true); setErr("");
    const found = await onLogin(u, p);
    if (!found) setErr(t("اسم المستخدم أو كلمة المرور غير صحيحة","Invalid username or password"));
    setLoading(false);
  };

  return (
    <div style={S.wrap}>
      <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
      {toast && <div style={S.toast(toast.type)}>{toast.msg}</div>}
      <div style={S.box}>
        {/* Logo */}
        <div style={{textAlign:"center", marginBottom:28}}>
          <div style={{fontSize:52, marginBottom:10}}>🦷</div>
          <div style={{fontWeight:900, fontSize:22, background:"linear-gradient(135deg,#38bdf8,#818cf8)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent"}}>
            {t("منصة تدريب ممرضات الأسنان","Dental Nurse Training Platform")}
          </div>
          <div style={{color:V.muted, fontSize:12, marginTop:5}}>Apex Care Clinics · {t("القصيم","Al-Qassim")}</div>
          {!GAS_OK() && <div style={{marginTop:10, padding:"5px 12px", borderRadius:8, background:"rgba(251,191,36,0.1)", border:"1px solid rgba(251,191,36,0.2)", fontSize:11, color:V.yel, display:"inline-block"}}>⚠️ {t("وضع تجريبي","Demo mode")}</div>}
        </div>

        <div style={S.card}>
          <div style={{marginBottom:14}}>
            <label style={S.lbl}>{t("اسم المستخدم","Username")}</label>
            <input style={S.inp} value={u} onChange={e=>setU(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} autoComplete="username"/>
          </div>
          <div style={{marginBottom:18}}>
            <label style={S.lbl}>{t("كلمة المرور","Password")}</label>
            <input style={S.inp} type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} autoComplete="current-password"/>
          </div>
          {err && <div style={{color:"#fca5a5", fontSize:12, marginBottom:12}}>{err}</div>}
          <button onClick={submit} style={S.pri} disabled={loading}>{loading ? t("جارٍ الدخول...","Logging in...") : t("دخول","Login")}</button>
        </div>

        <div style={{display:"flex", gap:8, justifyContent:"center", marginTop:14}}>
          {["ar","en"].map(l => (
            <button key={l} onClick={()=>setLang(l)} style={{padding:"6px 16px", borderRadius:8, border:"none", cursor:"pointer", fontWeight:700, fontSize:12, fontFamily:"inherit", background:lang===l?"linear-gradient(135deg,#38bdf8,#6366f1)":"#f1f5f9", color:lang===l?"#fff":"#64748b"}}>
              {l==="ar"?"العربية":"English"}
            </button>
          ))}
        </div>
        <div style={{textAlign:"center", color:"#1e293b", fontSize:11, marginTop:10}}>
          {t("تجريبي: nurse1/1234 | admin/admin123","Demo: nurse1/1234 | admin/admin123")}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════
//  NURSE PORTAL — تجربة تعلم نظيفة وبدون تعديل
// ══════════════════════════════════════════════════════
function NursePortal({ lang, setLang, db, user, sync, syncAll, token, toast, toastFn, onLogout }) {
  const t = (ar, en) => lang === "ar" ? ar : en;
  const [page, setPage]     = useState("home"); // home|spec|ipc|ipc_detail|quiz
  const [activeSpec, setAS] = useState(null);
  const [activeIPC,  setAI] = useState(null);
  const [quiz, setQuiz]     = useState(null);
  const [search, setSearch] = useState("");
  const [activeTab, setTab] = useState("tools"); // tools|procedures

  const dir = lang==="ar" ? "rtl" : "ltr";

  const filtered = db.specialties.filter(s =>
    !search ||
    s.nameAr.includes(search) ||
    s.nameEn.toLowerCase().includes(search.toLowerCase()) ||
    s.tools?.some(tl => tl.nameAr?.includes(search) || tl.nameEn?.toLowerCase().includes(search.toLowerCase()))
  );

  const startQuiz = gId => {
    const qs = db.quizzes[gId] || [];
    if (!qs.length) { toastFn(t("لا يوجد اختبار بعد","No quiz yet for this section"), "info"); return; }
    setQuiz({ groupId:gId, questions:qs, idx:0, score:0, done:false });
    setPage("quiz");
  };

  const answerQ = i => {
    const q = quiz.questions[quiz.idx];
    const ok = i === (q.answer || 0);
    const ns = quiz.score + (ok ? 1 : 0);
    const ni = quiz.idx + 1;
    setQuiz(q => ({...q, idx:ni, score:ns, done: ni >= q.questions.length}));
  };

  // ── STYLES (Nurse: warm, clean, focused on learning)
  const S = {
    app:  { direction:dir, fontFamily:lang==="ar"?"'Tajawal',sans-serif":"'Inter',sans-serif", background:"linear-gradient(150deg,#03070f 0%,#070e20 55%,#05091a 100%)", minHeight:"100vh", color:"#1e293b" },
    hdr:  { position:"sticky", top:0, zIndex:100, background:"rgba(3,7,15,0.9)", backdropFilter:"blur(20px)", borderBottom:"1px solid rgba(56,189,248,0.1)", padding:"10px 18px", display:"flex", alignItems:"center", justifyContent:"space-between" },
    pg:   { padding:"18px 16px", maxWidth:860, margin:"0 auto" },
    card: { background:"#ffffff", border:"1px solid #e8edf5", borderRadius:13, padding:16, marginBottom:12 },
    inp:  { background:"#f8fafc", border:"1px solid #e2e8f0", borderRadius:9, padding:"10px 14px", color:"#1e293b", fontSize:13, width:"100%", boxSizing:"border-box", outline:"none", fontFamily:"inherit" },
    pri:  { padding:"9px 18px", borderRadius:9, border:"none", cursor:"pointer", fontWeight:800, fontSize:13, background:"linear-gradient(135deg,#38bdf8,#6366f1)", color:"#fff", fontFamily:"inherit" },
    sec:  (c="#38bdf8") => ({ padding:"6px 14px", borderRadius:8, border:`1px solid ${c}30`, cursor:"pointer", fontWeight:700, fontSize:12, background:`${c}0f`, color:c, fontFamily:"inherit" }),
    row:  { display:"flex", gap:10, alignItems:"flex-start", padding:"10px 0", borderBottom:"1px solid #f1f5f9" },
    tag:  (c="#38bdf8") => ({ background:`${c}1c`, color:c, padding:"2px 8px", borderRadius:20, fontSize:11, fontWeight:700, flexShrink:0 }),
    spC:  (c) => ({ background:`linear-gradient(135deg,${c}0e,${c}03)`, border:`1px solid ${c}22`, borderRadius:13, padding:15, cursor:"pointer", transition:"transform 0.15s,box-shadow 0.15s" }),
    step: (c) => ({ background:`${c}0b`, border:`1px solid ${c}1e`, borderRadius:9, padding:"10px 13px", marginBottom:8, lineHeight:1.75, fontSize:13 }),
    tab2: (a,c="#38bdf8") => ({ padding:"8px 18px", borderRadius:9, cursor:"pointer", fontWeight:700, fontSize:12, border:"none", fontFamily:"inherit", background:a?`linear-gradient(135deg,${c},${c}bb)`:"#f1f5f9", color:a?"#fff":"#64748b" }),
    back: { display:"flex", alignItems:"center", gap:5, cursor:"pointer", color:V.hi, fontWeight:700, fontSize:13, marginBottom:12 },
    h2:   { fontSize:15, fontWeight:900, marginBottom:12, display:"flex", alignItems:"center", gap:8 },
    logo: { fontWeight:900, fontSize:15, background:"linear-gradient(135deg,#34d399,#60a5fa)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" },
    sync: (s) => ({ padding:"2px 9px", borderRadius:20, fontSize:10, fontWeight:700, background:s==="ok"?"rgba(52,211,153,0.14)":s==="syncing"?"rgba(251,191,36,0.14)":s==="error"?"rgba(248,113,113,0.14)":"rgba(100,116,139,0.14)", color:s==="ok"?"#6ee7b7":s==="syncing"?"#fbbf24":s==="error"?"#fca5a5":"#94a3b8" }),
    tst:  (tp) => ({ position:"fixed", top:16, [dir==="rtl"?"right":"left"]:16, padding:"10px 16px", borderRadius:10, zIndex:999, fontWeight:700, fontSize:13, fontFamily:"inherit", background:tp==="ok"?"rgba(16,185,129,0.94)":tp==="err"?"rgba(239,68,68,0.94)":"rgba(59,130,246,0.94)", color:"#fff" }),
  };

  const NHeader = () => (
    <div style={S.hdr}>
      <div style={{display:"flex", alignItems:"center", gap:8}}>
        <span style={{fontSize:18}}>🩺</span>
        <span style={S.logo}>{t("بوابة التمريض","Nurse Portal")}</span>
      </div>
      <div style={{display:"flex", gap:6, alignItems:"center"}}>
        <span style={S.sync(sync)}>{sync==="ok"?t("✓ متزامن","✓ Synced"):sync==="syncing"?t("...","..."):sync==="error"?t("خطأ","Err"):t("محلي","Local")}</span>
        {GAS_OK()&&sync!=="syncing"&&<button onClick={()=>syncAll(token)} style={S.sec()}>🔄</button>}
        <button onClick={()=>setLang(l=>l==="ar"?"en":"ar")} style={S.sec()}>{lang==="ar"?"EN":"ع"}</button>
        <div style={{display:"flex", alignItems:"center", gap:6, padding:"4px 10px", borderRadius:8, background:"#f1f5f9", fontSize:12}}>
          <span style={{color:V.grn}}>●</span>
          <span style={{fontWeight:700}}>{user.name}</span>
        </div>
        <button onClick={onLogout} style={{...S.sec(V.red), fontSize:11}}>↩ {t("خروج","Logout")}</button>
      </div>
    </div>
  );

  // QUIZ PAGE
  if (page==="quiz" && quiz) {
    if (quiz.done) {
      const pct = Math.round((quiz.score/quiz.questions.length)*100);
      return (
        <div style={S.app}><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
          {NHeader()}
          {toast && <div style={S.tst(toast.type)}>{toast.msg}</div>}
          <div style={S.pg}>
            <div style={{...S.card, textAlign:"center", padding:32}}>
              <div style={{fontSize:56}}>{pct>=70?"🎉":"📚"}</div>
              <div style={{fontSize:20, fontWeight:900, margin:"10px 0 6px"}}>{pct>=70 ? t("ممتاز! اجتزت الاختبار","Excellent! You passed!") : t("راجع المحتوى وحاول مجددًا","Review content & try again")}</div>
              <div style={{fontSize:38, fontWeight:900, color:pct>=70?V.grn:V.red, margin:"6px 0"}}>{pct}%</div>
              <div style={{color:V.muted, fontSize:13, marginBottom:22}}>{quiz.score} / {quiz.questions.length} {t("إجابة صحيحة","correct answers")}</div>
              {/* Score circles */}
              <div style={{display:"flex", justifyContent:"center", gap:6, marginBottom:22}}>
                {quiz.questions.map((_,i) => {
                  const answered = i < quiz.idx;
                  return <div key={i} style={{width:10,height:10,borderRadius:"50%",background:answered?(i<quiz.score?V.grn:V.red):"#cbd5e1"}}/>;
                })}
              </div>
              <div style={{display:"flex", gap:10, justifyContent:"center"}}>
                <button onClick={()=>setPage("home")} style={S.pri}>{t("الرئيسية","Home")}</button>

              </div>
            </div>
          </div>
        </div>
      );
    }
    const q = quiz.questions[quiz.idx];
    const opts = lang==="ar" ? (q.optionsAr||[]) : (q.optionsEn||[]);
    return (
      <div style={S.app}><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
        {NHeader()}
        {toast && <div style={S.tst(toast.type)}>{toast.msg}</div>}
        <div style={S.pg}>
          <div style={S.card}>
            <div style={{display:"flex", justifyContent:"space-between", marginBottom:12}}>
              <span style={{color:V.muted, fontSize:12, fontWeight:700}}>{t("السؤال","Question")} {quiz.idx+1} / {quiz.questions.length}</span>
              <span style={S.tag()}>{quiz.score} {t("نقطة","pts")}</span>
            </div>
            <div style={{height:5, background:"#f8fafc", borderRadius:10, marginBottom:18}}>

            </div>
            <div style={{fontSize:16, fontWeight:800, marginBottom:18, lineHeight:1.65}}>{t(q.questionAr, q.questionEn)}</div>

                onMouseEnter={e=>{e.currentTarget.style.background="rgba(56,189,248,0.1)";e.currentTarget.style.borderColor="rgba(56,189,248,0.3)";}}
                onMouseLeave={e=>{e.currentTarget.style.background="#f8fafc";e.currentTarget.style.borderColor="#e2e8f0";}}>
                <span style={{color:V.muted, marginInlineEnd:9, fontWeight:700}}>{String.fromCharCode(65+i)}.</span>{opt}

        </div>
      </div>

  }

  // SPECIALTY DETAIL
  if (page==="spec" && activeSpec) {
    const sp = activeSpec;
    return (
      <div style={S.app}><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
        {NHeader()}
        {toast && <div style={S.tst(toast.type)}>{toast.msg}</div>}

          <div style={S.back} onClick={()=>setPage("home")}>‹ {t("العودة للرئيسية","Back to Home")}</div>

          {/* Specialty Header */}
          <div style={{...S.card, background:`linear-gradient(135deg,${sp.color}10,${sp.color}03)`, border:`1px solid ${sp.color}22`}}>
            <div style={{display:"flex", alignItems:"center", gap:13, flexWrap:"wrap"}}>
              <span style={{fontSize:38}}>{sp.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:20, fontWeight:900}}>{t(sp.nameAr, sp.nameEn)}</div>
                <div style={{fontSize:11, color:V.muted, marginTop:2}}>{t(sp.nameEn, sp.nameAr)}</div>
              </div>
              <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
                <span style={S.tag()}>{sp.tools?.length||0} {t("أداة","tools")}</span>
                <span style={S.tag(V.grn)}>{sp.procedures?.length||0} {t("إجراء","procs")}</span>
                {(db.quizzes[sp.id]||[]).length>0 && (
                  <button onClick={()=>startQuiz(sp.id)} style={S.pri}>🧪 {t("ابدأ الاختبار","Start Quiz")}</button>
                )}
              </div>
            </div>
          </div>

          {/* Tab Switch */}
          <div style={{display:"flex", gap:7, marginBottom:14}}>
            <button style={S.tab2(activeTab==="tools", sp.color)} onClick={()=>setTab("tools")}>🔧 {t("الأدوات","Tools")} ({sp.tools?.length||0})</button>
            <button style={S.tab2(activeTab==="procedures", V.grn)} onClick={()=>setTab("procedures")}>📋 {t("الإجراءات","Procedures")} ({sp.procedures?.length||0})</button>
          </div>

          {/* Tools */}
          {activeTab==="tools" && (
            <div style={S.card}>
              {(sp.tools||[]).length===0 && <div style={{color:V.muted, textAlign:"center", padding:20, fontSize:13}}>{t("لا توجد أدوات","No tools available")}</div>}
              {(sp.tools||[]).map((tool,i) => (
                <div key={tool.id} style={S.row}>
                  <span style={S.tag(sp.color)}>{i+1}</span>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700, fontSize:14}}>{t(tool.nameAr,tool.nameEn)}</div>
                    <div style={{fontSize:11, color:V.muted, marginBottom:3}}>{t(tool.nameEn,tool.nameAr)}</div>
                    <div style={{fontSize:13, color:"#94a3b8", lineHeight:1.6}}>🎯 {t(tool.useAr, tool.useEn)}</div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Procedures */}
          {activeTab==="procedures" && (
            <div style={S.card}>
              {(sp.procedures||[]).length===0 && <div style={{color:V.muted, textAlign:"center", padding:20, fontSize:13}}>{t("لا توجد إجراءات","No procedures available")}</div>}
              {(sp.procedures||[]).map((proc,i) => (
                <div key={proc.id} style={S.row}>
                  <span style={S.tag(V.grn)}>{i+1}</span>
                  <span style={{flex:1, fontSize:14, fontWeight:600, lineHeight:1.5}}>{t(proc.nameAr, proc.nameEn)}</span>
                </div>
              ))}
            </div>
          )}

          {/* Quiz CTA */}
          {(db.quizzes[sp.id]||[]).length > 0 && (
            <div style={{...S.card, textAlign:"center", background:"linear-gradient(135deg,rgba(56,189,248,0.07),rgba(99,102,241,0.07))", border:"1px solid rgba(56,189,248,0.15)"}}>
              <div style={{fontSize:28, marginBottom:6}}>🧪</div>
              <div style={{fontWeight:800, marginBottom:4}}>{t("هل أنت مستعد للاختبار؟","Ready for the quiz?")}</div>
              <div style={{color:V.muted, fontSize:12, marginBottom:14}}>{(db.quizzes[sp.id]||[]).length} {t("أسئلة","questions")}</div>
              <button onClick={()=>startQuiz(sp.id)} style={S.pri}>{t("ابدأ الاختبار","Start Quiz")}</button>
            </div>
          )}
        </div>
      </div>
    );
  }

  // IPC DETAIL
  if (page==="ipc_detail" && activeIPC) {
    const mod = activeIPC;
    const qKey = "ipc_" + mod.id;
    return (
      <div style={S.app}><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
        {NHeader()}
        {toast && <div style={S.tst(toast.type)}>{toast.msg}</div>}
        <div style={S.pg}>
          <div style={S.back} onClick={()=>setPage("ipc")}>‹ {t("مكافحة العدوى","Infection Control")}</div>
          <div style={{...S.card, background:`linear-gradient(135deg,${mod.color}14,${mod.color}06)`, border:`1px solid ${mod.color}22`}}>
            <div style={{display:"flex", alignItems:"center", gap:11, flexWrap:"wrap"}}>
              <span style={{fontSize:32}}>{mod.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:17, fontWeight:900}}>{t(mod.nameAr, mod.nameEn)}</div>
                <div style={{color:V.muted, fontSize:11, marginTop:2}}>{mod.steps?.length||0} {t("خطوة","steps")}</div>
              </div>
              {(db.quizzes[qKey]||[]).length>0 && <button onClick={()=>startQuiz(qKey)} style={S.pri}>🧪 {t("اختبار","Quiz")}</button>}
            </div>
          </div>

          <div style={S.card}>
            {(mod.steps||[]).map((step,i) => (
              <div key={step.id} style={S.step(mod.color)}>
                <span style={{...S.tag(mod.color), marginInlineEnd:8, flexShrink:0, marginTop:2}}>{i+1}</span>
                <span style={{flex:1}}>{t(step.textAr, step.textEn)}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // IPC LIST
  if (page==="ipc") return (
    <div style={S.app}><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
      {NHeader()}
      {toast && <div style={S.tst(toast.type)}>{toast.msg}</div>}
      <div style={S.pg}>
        <div style={S.back} onClick={()=>setPage("home")}>‹ {t("الرئيسية","Home")}</div>
        <div style={S.h2}>🛡 {t("مكافحة العدوى والتعقيم","Infection Control & Sterilization")}</div>
        {db.ipcModules.map(mod => (
          <div key={mod.id} style={{...S.spC(mod.color), marginBottom:9}} onClick={()=>{setAI(mod);setPage("ipc_detail");}}>
            <div style={{display:"flex", alignItems:"center", gap:11}}>
              <span style={{fontSize:26}}>{mod.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:800, fontSize:14}}>{t(mod.nameAr, mod.nameEn)}</div>
                <div style={{fontSize:11, color:V.muted, marginTop:2}}>
                  {mod.steps?.length||0} {t("خطوة","steps")}
                  {(db.quizzes["ipc_"+mod.id]||[]).length>0 && ` · 🧪 ${(db.quizzes["ipc_"+mod.id]||[]).length} ${t("سؤال","Qs")}`}
                </div>
              </div>
              <span style={{color:mod.color, fontSize:18}}>›</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  // HOME
  return (
    <div style={S.app}><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
      {NHeader()}
      {toast && <div style={S.tst(toast.type)}>{toast.msg}</div>}
      <div style={S.pg}>
        {/* Welcome banner */}
        <div style={{...S.card, background:"linear-gradient(135deg,rgba(52,211,153,0.08),rgba(56,189,248,0.06))", border:"1px solid rgba(52,211,153,0.15)", marginBottom:14}}>
          <div style={{display:"flex", alignItems:"center", gap:12}}>
            <div style={{fontSize:36}}>👩‍⚕️</div>
            <div>
              <div style={{fontSize:16, fontWeight:900}}>👋 {t(`مرحبًا، ${user.name}`,`Welcome, ${user.name}`)}</div>
              <div style={{color:V.muted, fontSize:12, marginTop:3}}>{t("اختري تخصصًا أو وحدة للتعلم والمراجعة","Choose a specialty or module to study")}</div>
            </div>
          </div>
        </div>

        {/* Search */}
        <input style={{...S.inp, marginBottom:14}} placeholder={t("🔍 ابحث عن أداة أو تخصص...","🔍 Search tools or specialties...")} value={search} onChange={e=>setSearch(e.target.value)}/>

        {/* IPC Banner */}
        <div style={{...S.spC("#34d399"), marginBottom:14}} onClick={()=>setPage("ipc")}>
          <div style={{display:"flex", alignItems:"center", gap:11}}>
            <span style={{fontSize:28}}>🛡</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:800, fontSize:14}}>{t("مكافحة العدوى والتعقيم","Infection Control & Sterilization")}</div>
              <div style={{fontSize:11, color:V.muted, marginTop:3}}>
                {db.ipcModules.length} {t("وحدة","modules")} · Donning · Doffing · {t("اللحظات الخمس","5 Moments")}
              </div>
            </div>
            <span style={{color:"#34d399", fontSize:18}}>›</span>
          </div>
        </div>

        {/* Specialties */}
        <div style={S.h2}>🦷 {t("التخصصات الطبية","Medical Specialties")} <span style={S.tag()}>{filtered.length}</span></div>
        <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:9}}>
          {filtered.map(sp => (
            <div key={sp.id} style={S.spC(sp.color)}
              onClick={()=>{setAS(sp);setTab("tools");setPage("spec");}}
              onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow=`0 8px 24px ${sp.color}30`;}}
              onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow="";}}>
              <div style={{fontSize:24, marginBottom:5}}>{sp.icon}</div>
              <div style={{fontWeight:800, fontSize:13}}>{t(sp.nameAr, sp.nameEn)}</div>
              <div style={{fontSize:11, color:V.muted, marginTop:3}}>
                {sp.tools?.length||0} {t("أداة","tools")} · {sp.procedures?.length||0} {t("إجراء","procs")}
              </div>
              {(db.quizzes[sp.id]||[]).length>0 && (
                <div style={{marginTop:7}}><span style={S.tag(V.yel)}>🧪 {(db.quizzes[sp.id]||[]).length} {t("سؤال","Qs")}</span></div>
              )}
            </div>
          ))}
        </div>
        {!filtered.length && <div style={{textAlign:"center", color:V.muted, padding:28, fontSize:13}}>{t("لا توجد نتائج","No results found")}</div>}

        {/* Stats */}
        <div style={{...S.card, marginTop:14}}>
          <div style={{display:"flex", gap:10, justifyContent:"space-around", textAlign:"center"}}>
            {[
              [db.specialties.length, t("قسم","Specs"), V.hi],
              [db.specialties.reduce((a,s)=>a+(s.tools?.length||0),0), t("أداة","Tools"), V.pur],
              [db.ipcModules.length, "IPC", V.grn],
              [Object.values(db.quizzes).reduce((a,q)=>a+q.length,0), t("سؤال","Q's"), V.yel],
            ].map(([n,l,c]) => (
              <div key={l}><div style={{fontSize:22, fontWeight:900, color:c}}>{n}</div><div style={{fontSize:10, color:V.muted}}>{l}</div></div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════
//  ADMIN PORTAL — لوحة تحكم كاملة
// ══════════════════════════════════════════
function EditModalComponent({ modal, setModal, S, t, lang, addSpec, updSpec, addTool, updTool, addProc, updProc, addIPC, updIPC, addStep, updStep, addQ, updQ, addUser }) {
  const {type, item, extra} = modal;

  const init = () => {
    if (type==="spec")    return {nameAr:item?.nameAr||"",nameEn:item?.nameEn||"",icon:item?.icon||"🦷",color:item?.color||"#38bdf8"};
    if (type==="tool")    return {nameAr:item?.nameAr||"",nameEn:item?.nameEn||"",useAr:item?.useAr||"",useEn:item?.useEn||""};
    if (type==="proc")    return {nameAr:item?.nameAr||"",nameEn:item?.nameEn||""};
    if (type==="ipcmod")  return {nameAr:item?.nameAr||"",nameEn:item?.nameEn||"",icon:item?.icon||"🛡",color:item?.color||"#60a5fa"};
    if (type==="ipcstep") return {textAr:item?.textAr||"",textEn:item?.textEn||""};
    if (type==="quiz")    return {questionAr:item?.questionAr||"",questionEn:item?.questionEn||"",optionsAr:(item?.optionsAr||["","","",""]).join("\n"),optionsEn:(item?.optionsEn||["","","",""]).join("\n"),answer:item?.answer||0};
    if (type==="user")    return {name:"",username:"",password:"",role:"nurse"};
    return {};
  };

  const { useState: useLocalState } = React;
  const [form, setForm] = useLocalState(init);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const F = ({label, k, multi=false, inputType="text"}) => (
    <div style={{marginBottom:10}}>
      <label style={S.lbl}>{label}</label>
      {multi
        ? <textarea style={S.ta} value={form[k]||""} onChange={e=>set(k,e.target.value)}/>
        : <input style={S.inp} type={inputType} value={form[k]||""} onChange={e=>set(k,e.target.value)}/>}
    </div>
  );

  const save = () => {
    if (type==="spec")    { item ? updSpec(item.id,form) : addSpec(form); }
    if (type==="tool")    { item ? updTool(extra.spId,item.id,form) : addTool(extra.spId,form); }
    if (type==="proc")    { item ? updProc(extra.spId,item.id,form) : addProc(extra.spId,form); }
    if (type==="ipcmod")  { item ? updIPC(item.id,form) : addIPC(form); }
    if (type==="ipcstep") { item ? updStep(extra.modId,item.id,form) : addStep(extra.modId,form); }
    if (type==="quiz") {
      const ar = form.optionsAr.split("\n").map(s=>s.trim()).filter(Boolean);
      const en = form.optionsEn.split("\n").map(s=>s.trim()).filter(Boolean);
      const q  = {...form, optionsAr:ar, optionsEn:en, answer:parseInt(form.answer)||0};
      item ? updQ(extra.gId,item.id,q) : addQ(extra.gId,q);
    }
    if (type==="user") { addUser(form); }
    setModal(null);
  };

  const t2 = (ar,en) => lang==="ar" ? ar : en;
  const titles = {spec:t2("القسم","Specialty"),tool:t2("أداة","Tool"),proc:t2("إجراء","Procedure"),ipcmod:t2("وحدة IPC","IPC Module"),ipcstep:t2("خطوة","Step"),quiz:t2("سؤال اختبار","Quiz Question"),user:t2("مستخدم","User")};

  return (
    <div style={S.mdlBg} onClick={e=>e.target===e.currentTarget&&setModal(null)}>
      <div style={S.mdl}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{fontWeight:900,fontSize:15}}>{item?t2("تعديل","Edit"):t2("إضافة","Add")} — {titles[type]}</div>
          <button onClick={()=>setModal(null)} style={S.del}>✕</button>
        </div>

        {(type==="spec"||type==="tool"||type==="proc"||type==="ipcmod")&&<>
          <F label={t2("الاسم بالعربي","Name (Arabic)")} k="nameAr"/>
          <F label={t2("الاسم بالإنجليزي","Name (English)")} k="nameEn"/>
        </>}
        {(type==="spec"||type==="ipcmod")&&<>
          <F label={t2("الأيقونة (emoji)","Icon (emoji)")} k="icon"/>
          <F label={t2("اللون hex مثل #38bdf8","Color hex e.g. #38bdf8")} k="color"/>
        </>}
        {type==="tool"&&<>
          <F label={t2("الاستخدام بالعربي","Use / Function (Arabic)")} k="useAr" multi/>
          <F label={t2("الاستخدام بالإنجليزي","Use / Function (English)")} k="useEn" multi/>
        </>}
        {type==="ipcstep"&&<>
          <F label={t2("النص بالعربي","Step text (Arabic)")} k="textAr" multi/>
          <F label={t2("النص بالإنجليزي","Step text (English)")} k="textEn" multi/>
        </>}
        {type==="quiz"&&<>
          <F label={t2("السؤال بالعربي","Question (Arabic)")} k="questionAr" multi/>
          <F label={t2("السؤال بالإنجليزي","Question (English)")} k="questionEn" multi/>
          <F label={t2("الخيارات عربي — سطر لكل خيار","Options AR — one per line")} k="optionsAr" multi/>
          <F label={t2("الخيارات إنجليزي — سطر لكل خيار","Options EN — one per line")} k="optionsEn" multi/>
          <div style={{marginBottom:10}}>
            <label style={S.lbl}>{t2("رقم الإجابة الصحيحة (0 = الأول)","Correct answer index (0 = first)")}</label>
            <input style={S.inp} type="number" min="0" max="3" value={form.answer||0} onChange={e=>set("answer",e.target.value)}/>
          </div>
        </>}
        {type==="user"&&<>
          <F label={t2("الاسم الكامل","Full name")} k="name"/>
          <F label={t2("اسم المستخدم","Username")} k="username"/>
          <F label={t2("كلمة المرور","Password")} k="password" inputType="password"/>
          <div style={{marginBottom:10}}>
            <label style={S.lbl}>{t2("الدور","Role")}</label>
            <select style={S.inp} value={form.role||"nurse"} onChange={e=>set("role",e.target.value)}>
              <option value="nurse">{t2("ممرضة","Nurse")}</option>
              <option value="admin">{t2("مدير","Admin")}</option>
            </select>
          </div>
        </>}

        <button onClick={save} style={{...S.pri,width:"100%",marginTop:8}}>{t2("حفظ","Save")}</button>
      </div>
    </div>
  );
}

  const addIPC     = async f => { const id=gid(),item={...f,id,steps:[]}; await mut("addIPCModule",f,d=>d.ipcModules.push(item)); toastFn(t("تم الإضافة","Added")); };

  const addQ       = async (gId,f) => { const id=gid(),item={...f,id,groupId:gId}; await mut("addQuiz",{groupId:gId,...f},d=>{if(!d.quizzes[gId])d.quizzes[gId]=[];d.quizzes[gId].push(item);}); toastFn(t("تم إضافة السؤال","Question added")); };
  const updQ       = async (gId,id,f) => { await mut("updateQuiz",{id,...f},d=>{if(d.quizzes[gId]){const i=d.quizzes[gId].findIndex(x=>x.id===id);if(i>=0)Object.assign(d.quizzes[gId][i],f);}}); toastFn(t("تم التحديث","Updated")); };

  const addUser    = async f => { const id=gid(),item={...f,id}; await mut("addUser",f,d=>d.users.push(item)); toastFn(t(`تم إضافة المستخدم @${f.username} — كلمة المرور: ${f.password}`,`User @${f.username} added — password: ${f.password}`)); };
  const delUser    = async id => { if(id===user?.id){toastFn(t("لا يمكن حذف حسابك","Cannot delete own account"),"err");return;} await mut("deleteUser",{id},d=>{d.users=d.users.filter(u=>u.id!==id);}); toastFn(t("تم الحذف","Deleted")); };

  // ── STYLES (Admin: high-density, more professional, darker)
  const S = {
    app:  { direction:dir, fontFamily:lang==="ar"?"'Tajawal',sans-serif":"'Inter',sans-serif", background:"linear-gradient(150deg,#020508 0%,#050c18 55%,#040a14 100%)", minHeight:"100vh", color:"#1e293b" },

    tab:  (a) => ({ padding:"7px 14px", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:12, border:"none", fontFamily:"inherit", background:a?"linear-gradient(135deg,#8b5cf6,#6366f1)":"#f1f5f9", color:a?"#fff":"#64748b" }),
    back: { display:"flex", alignItems:"center", gap:5, cursor:"pointer", color:"#a78bfa", fontWeight:700, fontSize:13, marginBottom:12 },
    h2:   { fontSize:15, fontWeight:900, marginBottom:12, display:"flex", alignItems:"center", gap:7 },

  // ── AI QUIZ GENERATOR MODAL
  const AIQuizModal = () => {
    if (!aiModal) return null;
    const { gId, context } = aiModal;
    const [topic, setTopic] = useState(context || "");
    const [loading, setLoading] = useState(false);
    const [generated, setGenerated] = useState([]); // array of quiz objects
    const [selected, setSelected] = useState({}); // {idx: true/false}
    const [err, setErr] = useState("");

    // ── توليد الأسئلة عبر GAS كـ proxy (يتجنب CORS تماماً)
    const generate = async () => {
      if (!topic.trim()) return;
      setLoading(true); setErr(""); setGenerated([]); setSelected({});

      // إذا GAS غير مضبوط، نستخدم توليد محلي ذكي
      if (!GAS_OK()) {
        await generateLocal();
        setLoading(false);
        return;
      }

      try {
        const prompt = `أنت متخصص في طب الأسنان وتعليم الممرضات. المطلوب: توليد 5 أسئلة اختيار من متعدد (4 خيارات لكل سؤال) عن: "${topic}"
القواعد: كل سؤال له 4 خيارات، خيار صحيح واحد، باللغتين العربية والإنجليزية، تقيس الفهم وليس الحفظ، مناسبة لممرضات الأسنان.
أرجع JSON فقط بهذا الشكل بالضبط بدون أي نص إضافي:
[{"questionAr":"...","questionEn":"...","optionsAr":["...","...","...","..."],"optionsEn":["...","...","...","..."],"answer":0}]
answer هو رقم الخيار الصحيح (0-3).`;

        // نرسل للـ GAS كـ proxy — يتجنب CORS
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "aiGenerate", prompt }),
          headers: { "Content-Type": "text/plain" }
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "gas_error");
        const raw = data.result || "";
        const jsonMatch = raw.match(/\[[\s\S]*\]/);
        if (!jsonMatch) throw new Error("no_json");
        const parsed = JSON.parse(jsonMatch[0]);
        applyGenerated(parsed);
      } catch(e) {
        // fallback للتوليد الذكي المحلي عند أي خطأ GAS
        await generateLocal();
      }
      setLoading(false);
    };

    const applyGenerated = (parsed) => {
      setGenerated(parsed);
      const sel = {};
      parsed.forEach((_, i) => { sel[i] = true; });
      setSelected(sel);
    };

    // توليد محلي ذكي بدون API — يبني أسئلة من القوالب
    // ── Smart local generator — English-first, topic-aware
    const generateLocal = async () => {
      const topicClean = topic.trim();

      // ── الخطوة 1: ابحث في قاعدة معرفة طب الأسنان
      const matched = findInKB(topicClean);
      let finalQs = matched.length >= 5 ? matched.slice(0,5)
                  : matched.length > 0  ? [...matched, ...buildContextual(topicClean)].slice(0,5)
                  : buildContextual(topicClean);

      // ── الخطوة 2: اخلط ترتيب الإجابات
      const shuffled = finalQs.map(q => {
        const correct = { en: q.opts[q.ans].en, ar: q.opts[q.ans].ar };
        const others  = q.opts.filter((_,i) => i !== q.ans);
        const pos     = Math.floor(Math.random() * 4);
        const reordered = [...others];
        reordered.splice(pos, 0, correct);
        return {
          questionAr: q.qAr,
          questionEn: q.qEn,
          optionsAr:  reordered.map(o => o.ar),
          optionsEn:  reordered.map(o => o.en),
          answer:     pos
        };
      });
      applyGenerated(shuffled);
    };

    // ── قاعدة المعرفة الطبية — تطابق بالكلمات المفتاحية
    const findInKB = (topic) => {
      const tl = topic.toLowerCase();
      const match = (keys) => keys.some(k => tl.includes(k.toLowerCase()));
      const all = [];

      if (match(["mirror","مرآة","dental mirror","مرآة الفحص"])) all.push(
        { qEn:"What is the PRIMARY function of the dental mirror?", qAr:"ما الوظيفة الأساسية لمرآة الفحص؟",
          opts:[{en:"Indirect vision and tissue retraction",ar:"الرؤية غير المباشرة وإبعاد الأنسجة"},
                {en:"Measuring pocket depth",ar:"قياس عمق الجيب"},
                {en:"Applying topical anesthetic",ar:"تطبيق مخدر موضعي"},
                {en:"Rinsing the field",ar:"غسل الميدان"}], ans:0 },
        { qEn:"What technique is used when holding a dental mirror?", qAr:"ما تقنية الإمساك المستخدمة مع مرآة الفحص؟",
          opts:[{en:"Modified pen grasp with a finger rest",ar:"القبضة القلمية المعدلة مع دعامة إصبع"},
                {en:"Palm grasp only",ar:"القبضة الراحية فقط"},
                {en:"Two-finger pinch",ar:"قبضة الإصبعين"},
                {en:"No specific grasp required",ar:"لا يوجد إمساك محدد"}], ans:0 },
        { qEn:"How does fogging of the mirror affect the examination?", qAr:"كيف يؤثر تعفير المرآة على الفحص؟",
          opts:[{en:"Reduces visibility — prevent by warming or using anti-fog solution",ar:"يقلل الرؤية — يُمنع بالتدفئة أو محلول مضاد للتعفير"},
                {en:"Has no effect",ar:"لا تأثير له"},
                {en:"Improves magnification",ar:"يحسن التكبير"},
                {en:"Protects the tooth surface",ar:"يحمي سطح السن"}], ans:0 }
      );

      if (match(["probe","مسبار","periodontal probe","perio probe"])) all.push(
        { qEn:"What does a periodontal probe primarily measure?", qAr:"ما الذي يقيسه مسبار اللثة أساساً؟",
          opts:[{en:"Sulcus/pocket depth and clinical attachment level",ar:"عمق الجيب ومستوى الارتباط السريري"},
                {en:"Root length",ar:"طول الجذر"},
                {en:"Crown height",ar:"ارتفاع التاج"},
                {en:"Bone density",ar:"كثافة العظم"}], ans:0 },

        qAr:`في ممارسة طب الأسنان، ما دور الممرضة عند المساعدة في ${topic}؟`,
        opts:[{en:"Prepare instruments, assist the dentist, and maintain infection control",ar:"تحضير الأدوات ومساعدة الطبيب والحفاظ على مكافحة العدوى"},
              {en:"Perform the procedure independently",ar:"تنفيذ الإجراء باستقلالية"},
              {en:"Handle billing only",ar:"التعامل مع الفواتير فقط"},
              {en:"No specific role",ar:"لا دور محدد"}], ans:0 },
      { qEn:`Which classification of dental instrument includes those used in ${topic}?`,
        qAr:`أي تصنيف للأدوات السنية يشمل الأدوات المستخدمة في ${topic}؟`,
        opts:[{en:"Critical instruments — direct contact with sterile tissue",ar:"أدوات حيوية — تلامس مباشر مع أنسجة معقمة"},
              {en:"Non-critical instruments",ar:"أدوات غير حيوية"},
              {en:"Semi-critical instruments only",ar:"أدوات شبه حيوية فقط"},
              {en:"No classification applies",ar:"لا ينطبق أي تصنيف"}], ans:0 },
      { qEn:`Before starting ${topic}, which infection control step is mandatory?`,
        qAr:`قبل البدء في ${topic}، أي خطوة من مكافحة العدوى إلزامية؟`,
        opts:[{en:"Hand hygiene, correct PPE, and verified sterile instruments",ar:"نظافة اليدين، معدات الوقاية الصحيحة، والأدوات المعقمة المتحقق منها"},
              {en:"Wearing gloves only",ar:"ارتداء القفازات فقط"},
              {en:"Wiping the unit with alcohol",ar:"مسح الوحدة بالكحول"},
              {en:"No specific steps",ar:"لا خطوات محددة"}], ans:0 },
      { qEn:`Documentation after completing ${topic} must include:`,
        qAr:`التوثيق بعد الانتهاء من ${topic} يجب أن يشمل:`,
        opts:[{en:"Procedure performed, materials used, patient response, and clinician name",ar:"الإجراء المنفذ والمواد المستخدمة واستجابة المريض واسم المعالج"},
              {en:"Patient name only",ar:"اسم المريض فقط"},
              {en:"Date only",ar:"التاريخ فقط"},
              {en:"Insurance code only",ar:"رمز التأمين فقط"}], ans:0 },
      { qEn:`What should a dental nurse do if a sharps injury occurs during ${topic}?`,
        qAr:`ماذا يجب على ممرضة الأسنان فعله عند إصابة بالحاد أثناء ${topic}؟`,
        opts:[{en:"Wash wound, report immediately, follow exposure protocol",ar:"غسل الجرح والإبلاغ فوراً واتباع بروتوكول التعرض"},
              {en:"Ignore if minor",ar:"تجاهله إذا كان بسيطاً"},
              {en:"Apply antiseptic and continue",ar:"وضع مطهر والاستمرار"},
              {en:"Report only at end of shift",ar:"الإبلاغ فقط في نهاية الوردية"}], ans:0 },
    ];
    const addSelected = () => {
      generated.forEach((q, i) => {
        if (selected[i]) addQ(gId, q);
      });
      setAiModal(null);
      toastFn(t(`تم إضافة ${Object.values(selected).filter(Boolean).length} أسئلة ✓`,
               `Added ${Object.values(selected).filter(Boolean).length} questions ✓`));
    };

    const aiColors = { bg:"#0a0f1e", border:"rgba(168,85,247,0.3)", acc:"#a855f7" };

    return (
      <div style={S.mdlBg} onClick={e=>e.target===e.currentTarget&&setAiModal(null)}>
        <div style={{...S.mdl, maxWidth:560, background:aiColors.bg, borderColor:aiColors.border}}>
          {/* Header */}
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16}}>
            <div style={{display:"flex", alignItems:"center", gap:8}}>
              <span style={{fontSize:22}}>✨</span>
              <div>
                <div style={{fontWeight:900, fontSize:15, color:"#e9d5ff"}}>{t("توليد أسئلة بالذكاء الاصطناعي","AI Quiz Generator")}</div>
                <div style={{fontSize:11, color:"#7c3aed"}}>{GAS_OK() ? t("مشغّل بـ Claude AI","Powered by Claude AI") : t("توليد ذكي محلي + Claude عبر GAS","Smart local + Claude via GAS")}</div>
              </div>
            </div>
            <button onClick={()=>setAiModal(null)} style={S.del}>✕</button>
          </div>

          {/* Topic input */}
          <div style={{marginBottom:12}}>
            <label style={{...S.lbl, color:"#c4b5fd"}}>{t("الموضوع أو الأداة أو الإجراء","Topic / Tool / Procedure")}</label>
            <div style={{display:"flex", gap:8}}>
              <input style={{...S.inp, flex:1, borderColor:"rgba(168,85,247,0.3)", background:"rgba(168,85,247,0.08)"}}
                value={topic} onChange={e=>setTopic(e.target.value)}
                placeholder={t("مثال: مرآة الفحص واستخداماتها","e.g. Dental mirror and its uses")}
                onKeyDown={e=>e.key==="Enter"&&generate()}/>
              <button onClick={generate} disabled={loading||!topic.trim()}
                style={{padding:"8px 16px", borderRadius:8, border:"none", cursor:loading?"wait":"pointer",
                  fontWeight:800, fontSize:13, fontFamily:"inherit", whiteSpace:"nowrap",
                  background:loading?"rgba(168,85,247,0.3)":"linear-gradient(135deg,#7c3aed,#a855f7)",
                  color:"#fff", opacity:(!topic.trim()&&!loading)?0.5:1}}>
                {loading ? "⏳..." : t("✨ ولّد","✨ Generate")}
              </button>
            </div>
          </div>

          {err && <div style={{color:"#fca5a5", fontSize:12, marginBottom:10, padding:"8px 12px", borderRadius:8, background:"rgba(239,68,68,0.1)"}}>{err}</div>}

          {/* Loading state */}
          {loading && (
            <div style={{textAlign:"center", padding:28, color:"#c4b5fd"}}>
              <div style={{fontSize:32, marginBottom:8, animation:"spin 1s linear infinite"}}>✨</div>
              <div style={{fontSize:13}}>{t("جارٍ توليد الأسئلة بالذكاء الاصطناعي...","Generating AI questions...")}</div>
              <style>{`@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}`}</style>
            </div>
          )}

          {/* Generated questions */}
          {generated.length > 0 && (
            <div>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10}}>
                <div style={{fontSize:12, color:"#c4b5fd", fontWeight:700}}>
                  {t("اختر الأسئلة التي تريد إضافتها:","Select questions to add:")}
                  <span style={{color:"#a855f7", marginInlineStart:6}}>
                    {Object.values(selected).filter(Boolean).length}/{generated.length}
                  </span>
                </div>
                <button onClick={()=>setSelected(s=>{const n={};Object.keys(s).forEach(k=>n[k]=!Object.values(s).every(Boolean));return n;})}
                  style={{...S.sec("#a855f7"), fontSize:10}}>
                  {Object.values(selected).every(Boolean) ? t("إلغاء الكل","Deselect All") : t("تحديد الكل","Select All")}
                </button>
              </div>
              <div style={{maxHeight:320, overflowY:"auto", display:"flex", flexDirection:"column", gap:8}}>
                {generated.map((q, i) => (
                  <div key={i} onClick={()=>setSelected(s=>({...s,[i]:!s[i]}))}
                    style={{padding:"10px 12px", borderRadius:9, cursor:"pointer", border:`1px solid`,
                      borderColor:selected[i]?"rgba(139,92,246,0.5)":"#e2e8f0",
                      background:selected[i]?"rgba(139,92,246,0.08)":"#f8fafc",
                      transition:"all 0.15s"}}>
                    <div style={{display:"flex", gap:8, alignItems:"flex-start"}}>
                      <div style={{width:18, height:18, borderRadius:4, border:`2px solid ${selected[i]?"#a855f7":"#475569"}`,
                        background:selected[i]?"#a855f7":"transparent", flexShrink:0, marginTop:1,
                        display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, color:"#fff"}}>
                        {selected[i]?"✓":""}
                      </div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:12, fontWeight:700, color:"#1e293b", marginBottom:4, lineHeight:1.5}}>
                          {lang==="ar" ? q.questionAr : q.questionEn}
                        </div>
                        <div style={{display:"flex", flexDirection:"column", gap:2}}>
                          {(lang==="ar" ? q.optionsAr : q.optionsEn).map((opt, oi) => (
                            <div key={oi} style={{fontSize:11, color: oi===q.answer?"#6ee7b7":"#64748b",
                              display:"flex", gap:5, alignItems:"center"}}>
                              <span style={{fontWeight:700}}>{String.fromCharCode(65+oi)}.</span>
                              <span>{opt}</span>
                              {oi===q.answer && <span style={{color:"#6ee7b7", fontSize:10}}>✓</span>}
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>

              {/* Add button */}
              <button onClick={addSelected}
                disabled={!Object.values(selected).some(Boolean)}
                style={{...S.pri, width:"100%", marginTop:12, background:"linear-gradient(135deg,#7c3aed,#a855f7)",
                  opacity:Object.values(selected).some(Boolean)?1:0.4}}>
                ➕ {t(`إضافة ${Object.values(selected).filter(Boolean).length} أسئلة`,
                      `Add ${Object.values(selected).filter(Boolean).length} Questions`)}
              </button>
            </div>
          )}
        </div>
      </div>
    );
  };

  // ── MODAL
  // EditModal rendered via portal pattern - stable reference
  const EditModal = () => modal ? <EditModalComponent modal={modal} setModal={setModal} S={S} t={t} lang={lang}
    addSpec={addSpec} updSpec={updSpec} addTool={addTool} updTool={updTool}
    addProc={addProc} updProc={updProc} addIPC={addIPC} updIPC={updIPC}
    addStep={addStep} updStep={updStep} addQ={addQ} updQ={updQ} addUser={addUser}
  /> : null;

  const AHeader = () => (
    <div style={S.hdr}>
      <div style={{display:"flex", alignItems:"center", gap:8}}>
        <span style={{fontSize:18}}>⚙️</span>
        <span style={S.logo}>{t("لوحة إدارة المنصة","Platform Admin Portal")}</span>
      </div>
      <div style={{display:"flex", gap:6, alignItems:"center", flexWrap:"wrap"}}>
        <span style={S.sync(sync)}>{sync==="ok"?t("✓ متزامن","✓ Synced"):sync==="syncing"?t("...","..."):sync==="error"?t("خطأ","Err"):t("محلي","Local")}</span>
        {GAS_OK()&&sync!=="syncing"&&<button onClick={()=>syncAll(token)} style={S.sec()}>🔄</button>}
        <button onClick={()=>setLang(l=>l==="ar"?"en":"ar")} style={S.sec()}>{lang==="ar"?"EN":"ع"}</button>
        <div style={{display:"flex", alignItems:"center", gap:6, padding:"4px 10px", borderRadius:8, background:"rgba(139,92,246,0.1)", border:"1px solid rgba(139,92,246,0.2)", fontSize:12}}>
          <span style={{color:"#a78bfa"}}>⚙️</span>
          <span style={{fontWeight:700, color:"#a78bfa"}}>{user.name}</span>
        </div>
        <button onClick={onLogout} style={{...S.sec(V.red), fontSize:11}}>↩ {t("خروج","Logout")}</button>
      </div>
    </div>
  );

  // ── SPECIALTY DETAIL PAGE (Admin)
  if (page==="spec_detail" && activeSpec) {
    const sp = activeSpec;
    const spQ = db.quizzes[sp.id] || [];
    return (
      <div style={S.app}><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
        {AHeader()}{toast&&<div style={S.tst(toast.type)}>{toast.msg}</div>}
        <EditModal/>
        <AIQuizModal/>
        <div style={S.pg}>
          <div style={S.back} onClick={()=>setPage("dashboard")}>‹ {t("لوحة التحكم","Dashboard")}</div>
          <div style={{...S.card, background:`linear-gradient(135deg,${sp.color}0e,${sp.color}03)`, border:`1px solid ${sp.color}22`, marginBottom:14}}>
            <div style={{display:"flex", alignItems:"center", gap:11, flexWrap:"wrap"}}>
              <span style={{fontSize:30}}>{sp.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:17, fontWeight:900}}>{t(sp.nameAr, sp.nameEn)}</div>
                <div style={{fontSize:11, color:V.muted}}>{t(sp.nameEn, sp.nameAr)}</div>
              </div>
              <div style={{display:"flex", gap:6}}>
                <button onClick={()=>setModal({type:"spec",item:sp})} style={S.edt}>✏️ {t("تعديل","Edit")}</button>
                <button onClick={()=>delSpec(sp.id)} style={S.del}>🗑 {t("حذف","Delete")}</button>
              </div>
            </div>
          </div>

          {/* Tools */}
          <div style={S.card}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:11}}>
              <div style={S.h2}>🔧 {t("الأدوات","Tools")} <span style={S.tag()}>{sp.tools?.length||0}</span></div>
              <button onClick={()=>setModal({type:"tool",item:null,extra:{spId:sp.id}})} style={S.sec()}>➕ {t("إضافة","Add")}</button>
            </div>
            {!(sp.tools?.length) && <div style={{color:V.muted,textAlign:"center",padding:14,fontSize:12}}>{t("لا توجد أدوات بعد","No tools yet")}</div>}
            {(sp.tools||[]).map((tool,i)=>(
              <div key={tool.id} style={S.row}>
                <span style={S.tag()}>{i+1}</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:13}}>{t(tool.nameAr,tool.nameEn)} <span style={{color:V.muted,fontSize:11}}>/ {t(tool.nameEn,tool.nameAr)}</span></div>
                  <div style={{fontSize:12,color:"#94a3b8",marginTop:2}}>🎯 {t(tool.useAr,tool.useEn)}</div>
                </div>
                <div style={{display:"flex",gap:5}}>
                  <button onClick={()=>setModal({type:"tool",item:tool,extra:{spId:sp.id}})} style={S.edt}>✏️</button>
                  <button onClick={()=>delTool(sp.id,tool.id)} style={S.del}>🗑</button>
                </div>
              </div>
            ))}
          </div>

          {/* Procedures */}
          <div style={S.card}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:11}}>
              <div style={S.h2}>📋 {t("الإجراءات","Procedures")} <span style={S.tag(V.grn)}>{sp.procedures?.length||0}</span></div>
              <button onClick={()=>setModal({type:"proc",item:null,extra:{spId:sp.id}})} style={S.sec(V.grn)}>➕ {t("إضافة","Add")}</button>
            </div>
            {!(sp.procedures?.length) && <div style={{color:V.muted,textAlign:"center",padding:14,fontSize:12}}>{t("لا توجد إجراءات","No procedures yet")}</div>}
            {(sp.procedures||[]).map((proc,i)=>(
              <div key={proc.id} style={S.row}>
                <span style={S.tag(V.grn)}>{i+1}</span>
                <span style={{flex:1,fontSize:13,fontWeight:600}}>{t(proc.nameAr,proc.nameEn)}</span>
                <div style={{display:"flex",gap:5}}>
                  <button onClick={()=>setModal({type:"proc",item:proc,extra:{spId:sp.id}})} style={S.edt}>✏️</button>
                  <button onClick={()=>delProc(sp.id,proc.id)} style={S.del}>🗑</button>
                </div>
              </div>
            ))}
          </div>

          {/* Quiz Questions */}
          <div style={S.card}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:11}}>
              <div style={S.h2}>🧪 {t("أسئلة الاختبار","Quiz Questions")} <span style={S.tag(V.yel)}>{spQ.length}</span></div>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>setAiModal({gId:sp.id, context:sp.nameAr})}
                  style={{padding:"5px 12px",borderRadius:7,border:"1px solid rgba(168,85,247,0.35)",cursor:"pointer",fontWeight:800,fontSize:11,background:"rgba(168,85,247,0.12)",color:"#c084fc",fontFamily:"inherit"}}>
                  ✨ {t("AI","AI")}
                </button>
                <button onClick={()=>setModal({type:"quiz",item:null,extra:{gId:sp.id}})} style={S.sec(V.yel)}>➕ {t("إضافة سؤال","Add Q")}</button>
              </div>
            </div>
            {spQ.map((q,i)=>(
              <div key={q.id} style={S.row}>
                <span style={S.tag(V.yel)}>{i+1}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,fontWeight:700}}>{t(q.questionAr,q.questionEn)}</div>
                  <div style={{fontSize:11,color:V.muted}}>✓ {t((q.optionsAr||[])[q.answer||0],(q.optionsEn||[])[q.answer||0])}</div>
                </div>
                <div style={{display:"flex",gap:5}}>
                  <button onClick={()=>setModal({type:"quiz",item:q,extra:{gId:sp.id}})} style={S.edt}>✏️</button>
                  <button onClick={()=>delQ(sp.id,q.id)} style={S.del}>🗑</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // ── IPC DETAIL PAGE (Admin)
  if (page==="ipc_detail" && activeIPC) {
    const mod = activeIPC;
    const qKey = "ipc_"+mod.id;
    const mQ   = db.quizzes[qKey] || [];
    return (
      <div style={S.app}><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
        {AHeader()}{toast&&<div style={S.tst(toast.type)}>{toast.msg}</div>}
        <EditModal/>
        <AIQuizModal/>
        <div style={S.pg}>
          <div style={S.back} onClick={()=>setPage("dashboard")}>‹ {t("لوحة التحكم","Dashboard")}</div>
          <div style={{...S.card, background:`linear-gradient(135deg,${mod.color}0e,${mod.color}03)`, border:`1px solid ${mod.color}22`}}>
            <div style={{display:"flex", alignItems:"center", gap:10, flexWrap:"wrap"}}>
              <span style={{fontSize:28}}>{mod.icon}</span>
              <div style={{flex:1}}><div style={{fontSize:16, fontWeight:900}}>{t(mod.nameAr, mod.nameEn)}</div></div>
              <div style={{display:"flex", gap:6}}>
                <button onClick={()=>setModal({type:"ipcmod",item:mod})} style={S.edt}>✏️</button>
                <button onClick={()=>delIPC(mod.id)} style={S.del}>🗑 {t("حذف","Del")}</button>
              </div>
            </div>
          </div>

          <div style={S.card}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:11}}>
              <div style={S.h2}>📝 {t("الخطوات","Steps")} <span style={S.tag(mod.color)}>{mod.steps?.length||0}</span></div>
              <button onClick={()=>setModal({type:"ipcstep",item:null,extra:{modId:mod.id}})} style={S.sec(mod.color)}>➕ {t("إضافة","Add")}</button>
            </div>
            {(mod.steps||[]).map((step,i)=>(
              <div key={step.id} style={S.step(mod.color)}>
                <span style={{...S.tag(mod.color), marginInlineEnd:8}}>{i+1}</span>
                <div style={{flex:1, fontSize:12, lineHeight:1.7}}>{t(step.textAr, step.textEn)}</div>
                <div style={{display:"flex", gap:5, flexShrink:0}}>
                  <button onClick={()=>setModal({type:"ipcstep",item:step,extra:{modId:mod.id}})} style={S.edt}>✏️</button>
                  <button onClick={()=>delStep(mod.id,step.id)} style={S.del}>🗑</button>
                </div>
              </div>
            ))}
          </div>

          <div style={S.card}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:11}}>
              <div style={S.h2}>🧪 {t("أسئلة الاختبار","Quiz Questions")} <span style={S.tag(V.yel)}>{mQ.length}</span></div>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>setAiModal({gId:qKey, context:mod.nameAr})}
                  style={{padding:"5px 12px",borderRadius:7,border:"1px solid rgba(168,85,247,0.35)",cursor:"pointer",fontWeight:800,fontSize:11,background:"rgba(168,85,247,0.12)",color:"#c084fc",fontFamily:"inherit"}}>
                  ✨ AI
                </button>
                <button onClick={()=>setModal({type:"quiz",item:null,extra:{gId:qKey}})} style={S.sec(V.yel)}>➕</button>
              </div>
            </div>
            {mQ.map((q,i)=>(
              <div key={q.id} style={S.row}>
                <span style={S.tag(V.yel)}>{i+1}</span>
                <div style={{flex:1, fontSize:12}}>{t(q.questionAr,q.questionEn)}</div>
                <div style={{display:"flex",gap:5}}>
                  <button onClick={()=>setModal({type:"quiz",item:q,extra:{gId:qKey}})} style={S.edt}>✏️</button>
                  <button onClick={()=>delQ(qKey,q.id)} style={S.del}>🗑</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // ── MAIN DASHBOARD
  const totalTools  = db.specialties.reduce((a,s)=>a+(s.tools?.length||0),0);
  const totalProcs  = db.specialties.reduce((a,s)=>a+(s.procedures?.length||0),0);
  const totalQs     = Object.values(db.quizzes).reduce((a,q)=>a+q.length,0);
  const nurses      = db.users.filter(u=>u.role==="nurse");
  const admins      = db.users.filter(u=>u.role==="admin");

  return (
    <div style={S.app}><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
      {AHeader()}{toast&&<div style={S.tst(toast.type)}>{toast.msg}</div>}
      <EditModal/>
      <div style={S.pg}>

        {/* KPI Row */}
        <div style={{...S.grid2, gridTemplateColumns:"repeat(4,1fr)", marginBottom:14}}>
          {[
            [db.specialties.length, t("قسم","Specialties"), "🦷", V.hi],
            [totalTools,            t("أداة","Tools"),       "🔧", V.pur],
            [totalProcs,            t("إجراء","Procedures"), "📋", V.grn],
            [totalQs,               t("سؤال اختبار","Quiz Qs"),"🧪", V.yel],
          ].map(([n,l,ic,c])=>(
            <div key={l} style={{background:"#ffffff",border:`1px solid ${c}22`,borderRadius:11,padding:"14px 16px",textAlign:"center"}}>
              <div style={{fontSize:20, marginBottom:4}}>{ic}</div>
              <div style={{fontSize:22, fontWeight:900, color:c}}>{n}</div>
              <div style={{fontSize:10, color:V.muted}}>{l}</div>
            </div>
          ))}
        </div>

        {/* Tabs */}
        <div style={{display:"flex", gap:5, marginBottom:14, flexWrap:"wrap"}}>
          {["specialties","ipc","users","settings"].map(t2=>(
            <button key={t2} style={S.tab(tab===t2)} onClick={()=>setTab(t2)}>
              {t2==="specialties"?t("🦷 الأقسام","🦷 Specialties"):t2==="ipc"?t("🛡 IPC","🛡 IPC"):t2==="users"?t("👥 المستخدمون","👥 Users"):t("⚙️ إعدادات","⚙️ Settings")}
            </button>
          ))}
        </div>

        {/* SPECIALTIES TAB */}
        {tab==="specialties"&&<div>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:11}}>
            <div style={{fontWeight:800, fontSize:14}}>{t("الأقسام الطبية","Medical Specialties")} ({db.specialties.length})</div>
            <button onClick={()=>setModal({type:"spec",item:null})} style={S.sec()}>➕ {t("إضافة قسم","New Specialty")}</button>
          </div>
          {db.specialties.map(sp=>(
            <div key={sp.id} style={S.spR}>
              <span style={{fontSize:20}}>{sp.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:800,fontSize:13}}>{t(sp.nameAr, sp.nameEn)}</div>
                <div style={{fontSize:11,color:V.muted,display:"flex",gap:10,marginTop:2}}>
                  <span>🔧 {sp.tools?.length||0} {t("أداة","tools")}</span>
                  <span>📋 {sp.procedures?.length||0} {t("إجراء","procs")}</span>
                  <span>🧪 {(db.quizzes[sp.id]||[]).length} {t("سؤال","Qs")}</span>
                </div>
              </div>
              <div style={{display:"flex",gap:5}}>
                <button onClick={()=>{setAS(sp);setPage("spec_detail");}} style={S.sec()}>📂 {t("تفاصيل","Details")}</button>
                <button onClick={()=>setModal({type:"spec",item:sp})} style={S.edt}>✏️</button>
                <button onClick={()=>delSpec(sp.id)} style={S.del}>🗑</button>
              </div>
            </div>
          ))}
        </div>}

        {/* IPC TAB */}
        {tab==="ipc"&&<div>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:11}}>
            <div style={{fontWeight:800,fontSize:14}}>{t("وحدات مكافحة العدوى","Infection Control Modules")} ({db.ipcModules.length})</div>
            <button onClick={()=>setModal({type:"ipcmod",item:null})} style={S.sec()}>➕ {t("وحدة جديدة","New Module")}</button>
          </div>
          {db.ipcModules.map(mod=>(
            <div key={mod.id} style={S.spR}>
              <span style={{fontSize:20}}>{mod.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:800,fontSize:13}}>{t(mod.nameAr, mod.nameEn)}</div>
                <div style={{fontSize:11,color:V.muted,display:"flex",gap:10,marginTop:2}}>
                  <span>📝 {mod.steps?.length||0} {t("خطوة","steps")}</span>
                  <span>🧪 {(db.quizzes["ipc_"+mod.id]||[]).length} {t("سؤال","Qs")}</span>
                </div>
              </div>
              <div style={{display:"flex",gap:5}}>
                <button onClick={()=>{setAI(mod);setPage("ipc_detail");}} style={S.sec()}>📂 {t("تفاصيل","Details")}</button>
                <button onClick={()=>setModal({type:"ipcmod",item:mod})} style={S.edt}>✏️</button>
                <button onClick={()=>delIPC(mod.id)} style={S.del}>🗑</button>
              </div>
            </div>
          ))}
        </div>}

        {/* USERS TAB */}
        {tab==="users"&&<div>
          <div style={{...S.grid2, marginBottom:12}}>
            {[[nurses.length,t("ممرضة","Nurses"),V.grn,"👩‍⚕️"],[admins.length,t("مدير","Admins"),V.pur,"⚙️"]].map(([n,l,c,ic])=>(
              <div key={l} style={{background:"#ffffff",border:`1px solid ${c}22`,borderRadius:11,padding:"14px 16px",textAlign:"center"}}><div style={{fontSize:22}}>{ic}</div><div style={{fontSize:20,fontWeight:900,color:c}}>{n}</div><div style={{fontSize:11,color:V.muted}}>{l}</div></div>
            ))}
          </div>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:11}}>
            <div style={{fontWeight:800,fontSize:13}}>{t("قائمة المستخدمين","User List")} ({db.users.length})</div>
            <button onClick={()=>setModal({type:"user",item:null})} style={S.sec()}>➕ {t("مستخدم جديد","New User")}</button>
          </div>
          {db.users.map(u=>(
            <div key={u.id} style={S.spR}>
              <div style={{width:32,height:32,borderRadius:"50%",background:u.role==="admin"?"rgba(139,92,246,0.2)":"rgba(52,211,153,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>
                {u.role==="admin"?"⚙️":"👩‍⚕️"}
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:13}}>{u.name}</div>
                <div style={{fontSize:11,color:V.muted}}>@{u.username}</div>
              </div>
              <span style={S.tag(u.role==="admin"?V.pur:V.grn)}>{u.role}</span>
              {u.id!==user?.id&&<button onClick={()=>delUser(u.id)} style={S.del}>🗑</button>}
            </div>
          ))}
        </div>}

        {/* SETTINGS TAB */}
        {tab==="settings"&&<div>
          <div style={S.card}>
            <div style={{fontWeight:900,marginBottom:11,fontSize:13}}>🔗 {t("إعدادات GAS","GAS Connection")}</div>
            <div style={{background:"#f8fafc",padding:"8px 12px",borderRadius:8,fontSize:11,color:"#94a3b8",wordBreak:"break-all",marginBottom:10}}>{GAS_URL}</div>
            <span style={S.tag(GAS_OK()?V.grn:V.yel)}>{GAS_OK()?t("✓ متصل","✓ Connected"):t("⚠️ غير مضبوط","⚠️ Not configured")}</span>
          </div>
          <div style={S.card}>
            <div style={{fontWeight:800,marginBottom:10,fontSize:13}}>📋 {t("خطوات الربط","Setup Steps")}</div>
            {[
              t("1. افتح Code.gs في Google Apps Script","1. Open Code.gs in Google Apps Script"),
              t("2. ضع معرّف الـ Spreadsheet في SS_ID","2. Set your Spreadsheet ID in SS_ID"),
              t("3. شغّل دالة setupSpreadsheet() مرة واحدة","3. Run setupSpreadsheet() once from editor"),
              t("4. انشر: Deploy > New deployment > Web App","4. Deploy > New deployment > Web app"),
              t("5. Execute as: Me | Who has access: Anyone","5. Execute as: Me | Who has access: Anyone"),
              t("6. انسخ رابط النشر وضعه في GAS_URL بهذا الملف","6. Paste the Deployment URL into GAS_URL in this file"),
            ].map((s,i)=><div key={i} style={{fontSize:12,color:"#94a3b8",marginBottom:6}}>• {s}</div>)}
          </div>
          <div style={S.card}>
            <div style={{fontWeight:800,marginBottom:8,fontSize:13}}>📊 {t("هيكل Google Sheets","Sheets Structure")}</div>
            {["Users","Specialties","Tools","Procedures","IPC_Modules","IPC_Steps","Quizzes","Logs"].map(sh=>(
              <div key={sh} style={{...S.row,padding:"5px 0"}}><span style={S.tag()}>{sh}</span></div>
            ))}
          </div>
        </div>}
      </div>
    </div>
  );
}

    // Mount — loading screen is hidden from inside App via useEffect
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
