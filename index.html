const gid  = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const deep = x  => JSON.parse(JSON.stringify(x));

async function api(action, params={}, token=null) {
  if (!GAS_OK()) throw new Error("GAS_NOT_CONFIGURED");
  const body = { action, ...params, ...(token ? {token} : {}) };
  const res  = await fetch(GAS_URL, { method:"POST", body:JSON.stringify(body), headers:{"Content-Type":"text/plain"} });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "api_error");
  return json;
}

function App() {
  const [lang,  setLang]  = useState("ar");
  const [db,    setDb]    = useState(deep(SEED));
  const [user,  setUser]  = useState(null);
  const [token, setToken] = useState(null);
  const [sync,  setSync]  = useState("offline");
  const [toast, setToast] = useState(null);

  const t = (ar, en) => lang === "ar" ? ar : en;

  // إخفاء شاشة التحميل بعد أول render
  useEffect(() => {
    const el = document.getElementById('loading');
    if (el) el.style.display = 'none';
  }, []);

  const toastFn = useCallback((msg, type="ok") => {
    setToast({msg, type});
    setTimeout(() => setToast(null), 3000);
  }, []);

  const syncAll = async (tk) => {
    setSync("syncing");
    try {
      const r = await api("getAll", {}, tk || token);
      const q = {};
      Object.entries(r.data.quizzes||{}).forEach(([k,arr]) => {
        q[k] = arr.map(x => ({...x,
          optionsAr: typeof x.optionsAr==="string" ? JSON.parse(x.optionsAr||"[]") : (x.optionsAr||[]),
          optionsEn: typeof x.optionsEn==="string" ? JSON.parse(x.optionsEn||"[]") : (x.optionsEn||[]),
          answer: parseInt(x.answer)||0,
        }));
      });
      setDb(d => ({...d, specialties:r.data.specialties, ipcModules:r.data.ipcModules, quizzes:q}));
      setSync("ok");
    } catch { setSync("error"); }
  };

  useEffect(() => { if (GAS_OK()) syncAll(); }, []);

  const doLogin = async (u, p) => {
    if (GAS_OK()) {
      setSync("syncing");
      try {
        const r = await api("login", {username:u, password:p});
        setUser(r.user); setToken(r.token);
        await syncAll(r.token);
        return r.user;
      } catch { setSync("error"); }
    }
    const found = db.users.find(x => x.username===u && x.password===p);
    if (found) { setUser(found); return found; }
    return null;
  };

  const doLogout = () => { setUser(null); setToken(null); };

  // Optimistic mutation
  const mut = async (gasAction, gasParams, localFn) => {
    setDb(d => { const n=deep(d); localFn(n); return n; });
    if (GAS_OK() && token) {
      setSync("syncing");
      try { await api(gasAction, gasParams, token); setSync("ok"); }
      catch { setSync("error"); toastFn(t("فشل الحفظ في الخادم","Server save failed"), "err"); }
    }
  };

  if (!user) return (
    <LoginScreen lang={lang} setLang={setLang} sync={sync} onLogin={doLogin} toast={toast} />
  );

  if (user.role === "admin") return (
    <AdminPortal key={lang} lang={lang} setLang={setLang} db={db} user={user} token={token}
      sync={sync} syncAll={syncAll} toast={toast} toastFn={toastFn}
      mut={mut} onLogout={doLogout} />
  );

  return (
    <NursePortal key={lang} lang={lang} setLang={setLang} db={db} user={user}
      sync={sync} syncAll={syncAll} token={token} toast={toast} toastFn={toastFn}
      onLogout={doLogout} />
  );
}

    const q = quiz.questions[quiz.idx];
    const opts = lang==="ar" ? (q.optionsAr||[]) : (q.optionsEn||[]);
    return (
      <div style={S.app}><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
        {NHeader()}
        {toast && <div style={S.tst(toast.type)}>{toast.msg}</div>}
        <div style={S.pg}>
          <div style={S.card}>
            <div style={{display:"flex", justifyContent:"space-between", marginBottom:12}}>
              <span style={{color:V.muted, fontSize:12, fontWeight:700}}>{t("السؤال","Question")} {quiz.idx+1} / {quiz.questions.length}</span>
              <span style={S.tag()}>{quiz.score} {t("نقطة","pts")}</span>
            </div>
            <div style={{height:5, background:"rgba(255,255,255,0.06)", borderRadius:10, marginBottom:18}}>
              <div style={{width:`${(quiz.idx/quiz.questions.length)*100}%`, height:"100%", background:"linear-gradient(90deg,#38bdf8,#818cf8)", borderRadius:10, transition:"width 0.4s"}}/>
            </div>
            <div style={{fontSize:16, fontWeight:800, marginBottom:18, lineHeight:1.65}}>{t(q.questionAr, q.questionEn)}</div>
            {opts.map((opt,i) => (
              <div key={i} onClick={()=>answerQ(i)}
                style={{background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.08)", borderRadius:9, padding:"11px 15px", cursor:"pointer", marginBottom:7, fontSize:13, transition:"all 0.12s"}}
                onMouseEnter={e=>{e.currentTarget.style.background="rgba(56,189,248,0.1)";e.currentTarget.style.borderColor="rgba(56,189,248,0.3)";}}
                onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,255,255,0.04)";e.currentTarget.style.borderColor="rgba(255,255,255,0.08)";}}>
                <span style={{color:V.muted, marginInlineEnd:9, fontWeight:700}}>{String.fromCharCode(65+i)}.</span>{opt}
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // SPECIALTY DETAIL
  if (page==="spec" && activeSpec) {
    const sp = activeSpec;
    return (
      <div style={S.app}><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
        {NHeader()}
        {toast && <div style={S.tst(toast.type)}>{toast.msg}</div>}
        <div style={S.pg}>
          <div style={S.back} onClick={()=>setPage("home")}>‹ {t("العودة للرئيسية","Back to Home")}</div>

          {/* Specialty Header */}
          <div style={{...S.card, background:`linear-gradient(135deg,${sp.color}10,${sp.color}03)`, border:`1px solid ${sp.color}22`}}>
            <div style={{display:"flex", alignItems:"center", gap:13, flexWrap:"wrap"}}>
              <span style={{fontSize:38}}>{sp.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:20, fontWeight:900}}>{t(sp.nameAr, sp.nameEn)}</div>
                <div style={{fontSize:11, color:V.muted, marginTop:2}}>{t(sp.nameEn, sp.nameAr)}</div>
              </div>
              <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
                <span style={S.tag()}>{sp.tools?.length||0} {t("أداة","tools")}</span>
                <span style={S.tag(V.grn)}>{sp.procedures?.length||0} {t("إجراء","procs")}</span>
                {(db.quizzes[sp.id]||[]).length>0 && (
                  <button onClick={()=>startQuiz(sp.id)} style={S.pri}>🧪 {t("ابدأ الاختبار","Start Quiz")}</button>
                )}
              </div>
            </div>
          </div>

          {/* Tab Switch */}
          <div style={{display:"flex", gap:7, marginBottom:14}}>
            <button style={S.tab2(activeTab==="tools", sp.color)} onClick={()=>setTab("tools")}>🔧 {t("الأدوات","Tools")} ({sp.tools?.length||0})</button>
            <button style={S.tab2(activeTab==="procedures", V.grn)} onClick={()=>setTab("procedures")}>📋 {t("الإجراءات","Procedures")} ({sp.procedures?.length||0})</button>
          </div>

          {/* Tools */}
          {activeTab==="tools" && (
            <div style={S.card}>
              {(sp.tools||[]).length===0 && <div style={{color:V.muted, textAlign:"center", padding:20, fontSize:13}}>{t("لا توجد أدوات","No tools available")}</div>}
              {(sp.tools||[]).map((tool,i) => (
                <div key={tool.id} style={S.row}>
                  <span style={S.tag(sp.color)}>{i+1}</span>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700, fontSize:14}}>{t(tool.nameAr,tool.nameEn)}</div>
                    <div style={{fontSize:11, color:V.muted, marginBottom:3}}>{t(tool.nameEn,tool.nameAr)}</div>
                    <div style={{fontSize:13, color:"#94a3b8", lineHeight:1.6}}>🎯 {t(tool.useAr, tool.useEn)}</div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Procedures */}
          {activeTab==="procedures" && (
            <div style={S.card}>
              {(sp.procedures||[]).length===0 && <div style={{color:V.muted, textAlign:"center", padding:20, fontSize:13}}>{t("لا توجد إجراءات","No procedures available")}</div>}
              {(sp.procedures||[]).map((proc,i) => (
                <div key={proc.id} style={S.row}>
                  <span style={S.tag(V.grn)}>{i+1}</span>
                  <span style={{flex:1, fontSize:14, fontWeight:600, lineHeight:1.5}}>{t(proc.nameAr, proc.nameEn)}</span>
                </div>
              ))}
            </div>
          )}

          {/* Quiz CTA */}
          {(db.quizzes[sp.id]||[]).length > 0 && (
            <div style={{...S.card, textAlign:"center", background:"linear-gradient(135deg,rgba(56,189,248,0.07),rgba(99,102,241,0.07))", border:"1px solid rgba(56,189,248,0.15)"}}>
              <div style={{fontSize:28, marginBottom:6}}>🧪</div>
              <div style={{fontWeight:800, marginBottom:4}}>{t("هل أنت مستعد للاختبار؟","Ready for the quiz?")}</div>
              <div style={{color:V.muted, fontSize:12, marginBottom:14}}>{(db.quizzes[sp.id]||[]).length} {t("أسئلة","questions")}</div>
              <button onClick={()=>startQuiz(sp.id)} style={S.pri}>{t("ابدأ الاختبار","Start Quiz")}</button>
            </div>
          )}
        </div>
      </div>
    );
  }

  // IPC DETAIL
  if (page==="ipc_detail" && activeIPC) {
    const mod = activeIPC;
    const qKey = "ipc_" + mod.id;
    return (
      <div style={S.app}><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
        {NHeader()}
        {toast && <div style={S.tst(toast.type)}>{toast.msg}</div>}
        <div style={S.pg}>
          <div style={S.back} onClick={()=>setPage("ipc")}>‹ {t("مكافحة العدوى","Infection Control")}</div>
          <div style={{...S.card, background:`linear-gradient(135deg,${mod.color}0f,${mod.color}03)`, border:`1px solid ${mod.color}22`}}>
            <div style={{display:"flex", alignItems:"center", gap:11, flexWrap:"wrap"}}>
              <span style={{fontSize:32}}>{mod.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:17, fontWeight:900}}>{t(mod.nameAr, mod.nameEn)}</div>
                <div style={{color:V.muted, fontSize:11, marginTop:2}}>{mod.steps?.length||0} {t("خطوة","steps")}</div>
              </div>
              {(db.quizzes[qKey]||[]).length>0 && <button onClick={()=>startQuiz(qKey)} style={S.pri}>🧪 {t("اختبار","Quiz")}</button>}
            </div>
          </div>

          <div style={S.card}>
            {(mod.steps||[]).map((step,i) => (
              <div key={step.id} style={S.step(mod.color)}>
                <span style={{...S.tag(mod.color), marginInlineEnd:8, flexShrink:0, marginTop:2}}>{i+1}</span>
                <span style={{flex:1}}>{t(step.textAr, step.textEn)}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // IPC LIST
  if (page==="ipc") return (
    <div style={S.app}><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
      {NHeader()}
      {toast && <div style={S.tst(toast.type)}>{toast.msg}</div>}
      <div style={S.pg}>
        <div style={S.back} onClick={()=>setPage("home")}>‹ {t("الرئيسية","Home")}</div>
        <div style={S.h2}>🛡 {t("مكافحة العدوى والتعقيم","Infection Control & Sterilization")}</div>
        {db.ipcModules.map(mod => (
          <div key={mod.id} style={{...S.spC(mod.color), marginBottom:9}} onClick={()=>{setAI(mod);setPage("ipc_detail");}}>
            <div style={{display:"flex", alignItems:"center", gap:11}}>
              <span style={{fontSize:26}}>{mod.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:800, fontSize:14}}>{t(mod.nameAr, mod.nameEn)}</div>
                <div style={{fontSize:11, color:V.muted, marginTop:2}}>
                  {mod.steps?.length||0} {t("خطوة","steps")}
                  {(db.quizzes["ipc_"+mod.id]||[]).length>0 && ` · 🧪 ${(db.quizzes["ipc_"+mod.id]||[]).length} ${t("سؤال","Qs")}`}
                </div>
              </div>
              <span style={{color:mod.color, fontSize:18}}>›</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  // HOME
  return (
    <div style={S.app}><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
      {NHeader()}
      {toast && <div style={S.tst(toast.type)}>{toast.msg}</div>}
      <div style={S.pg}>
        {/* Welcome banner */}
        <div style={{...S.card, background:"linear-gradient(135deg,rgba(52,211,153,0.08),rgba(56,189,248,0.06))", border:"1px solid rgba(52,211,153,0.15)", marginBottom:14}}>
          <div style={{display:"flex", alignItems:"center", gap:12}}>
            <div style={{fontSize:36}}>👩‍⚕️</div>
            <div>
              <div style={{fontSize:16, fontWeight:900}}>👋 {t(`مرحبًا، ${user.name}`,`Welcome, ${user.name}`)}</div>
              <div style={{color:V.muted, fontSize:12, marginTop:3}}>{t("اختري تخصصًا أو وحدة للتعلم والمراجعة","Choose a specialty or module to study")}</div>
            </div>
          </div>
        </div>

        {/* Search */}
        <input style={{...S.inp, marginBottom:14}} placeholder={t("🔍 ابحث عن أداة أو تخصص...","🔍 Search tools or specialties...")} value={search} onChange={e=>setSearch(e.target.value)}/>

        {/* IPC Banner */}
        <div style={{...S.spC("#34d399"), marginBottom:14}} onClick={()=>setPage("ipc")}>
          <div style={{display:"flex", alignItems:"center", gap:11}}>
            <span style={{fontSize:28}}>🛡</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:800, fontSize:14}}>{t("مكافحة العدوى والتعقيم","Infection Control & Sterilization")}</div>
              <div style={{fontSize:11, color:V.muted, marginTop:3}}>
                {db.ipcModules.length} {t("وحدة","modules")} · Donning · Doffing · {t("اللحظات الخمس","5 Moments")}
              </div>
            </div>
            <span style={{color:"#34d399", fontSize:18}}>›</span>
          </div>
        </div>

        {/* Specialties */}
        <div style={S.h2}>🦷 {t("التخصصات الطبية","Medical Specialties")} <span style={S.tag()}>{filtered.length}</span></div>
        <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:9}}>
          {filtered.map(sp => (
            <div key={sp.id} style={S.spC(sp.color)}
              onClick={()=>{setAS(sp);setTab("tools");setPage("spec");}}
              onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow=`0 8px 24px ${sp.color}18`;}}
              onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow="";}}>
              <div style={{fontSize:24, marginBottom:5}}>{sp.icon}</div>
              <div style={{fontWeight:800, fontSize:13}}>{t(sp.nameAr, sp.nameEn)}</div>
              <div style={{fontSize:11, color:V.muted, marginTop:3}}>
                {sp.tools?.length||0} {t("أداة","tools")} · {sp.procedures?.length||0} {t("إجراء","procs")}
              </div>
              {(db.quizzes[sp.id]||[]).length>0 && (
                <div style={{marginTop:7}}><span style={S.tag(V.yel)}>🧪 {(db.quizzes[sp.id]||[]).length} {t("سؤال","Qs")}</span></div>
              )}
            </div>
          ))}
        </div>
        {!filtered.length && <div style={{textAlign:"center", color:V.muted, padding:28, fontSize:13}}>{t("لا توجد نتائج","No results found")}</div>}

        {/* Stats */}
        <div style={{...S.card, marginTop:14}}>
          <div style={{display:"flex", gap:10, justifyContent:"space-around", textAlign:"center"}}>
            {[
              [db.specialties.length, t("قسم","Specs"), V.hi],
              [db.specialties.reduce((a,s)=>a+(s.tools?.length||0),0), t("أداة","Tools"), V.pur],
              [db.ipcModules.length, "IPC", V.grn],
              [Object.values(db.quizzes).reduce((a,q)=>a+q.length,0), t("سؤال","Q's"), V.yel],
            ].map(([n,l,c]) => (
              <div key={l}><div style={{fontSize:22, fontWeight:900, color:c}}>{n}</div><div style={{fontSize:10, color:V.muted}}>{l}</div></div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════
//  ADMIN PORTAL — لوحة تحكم كاملة
// ══════════════════════════════════════════
function AdminPortal({ lang, setLang, db, user, token, sync, syncAll, toast, toastFn, mut, onLogout }) {
  const t = (ar, en) => lang === "ar" ? ar : en;
  const [page, setPage]     = useState("dashboard"); // dashboard|spec_detail|ipc_detail
  const [activeSpec, setAS] = useState(null);
  const [activeIPC,  setAI] = useState(null);
  const [tab,  setTab]      = useState("specialties");
  const [modal, setModal]   = useState(null); // {type, item?, extra?}
  const [aiModal, setAiModal] = useState(null); // {gId, context}
  const dir = lang==="ar" ? "rtl" : "ltr";

  // ── CRUD helpers
  const addSpec    = async f => { const id=gid(),item={...f,id,tools:[],procedures:[]}; await mut("addSpecialty",f,d=>d.specialties.push(item)); toastFn(t("تم إضافة القسم","Specialty added")); };
  const updSpec    = async (id,f) => { await mut("updateSpecialty",{id,...f},d=>{const i=d.specialties.findIndex(s=>s.id===id);if(i>=0)Object.assign(d.specialties[i],f);}); if(activeSpec?.id===id)setAS(s=>({...s,...f})); toastFn(t("تم التحديث","Updated")); };
  const delSpec    = async id => { if(!confirm(t("حذف القسم وكل محتوياته؟","Delete specialty and all its content?")))return; await mut("deleteSpecialty",{id},d=>{d.specialties=d.specialties.filter(s=>s.id!==id);delete d.quizzes[id];}); if(activeSpec?.id===id){setAS(null);setPage("dashboard");} toastFn(t("تم الحذف","Deleted")); };
  const addTool    = async (spId,f) => { const id=gid(),item={...f,id,specialtyId:spId}; await mut("addTool",{specialtyId:spId,...f},d=>{const s=d.specialties.find(x=>x.id===spId);if(s)s.tools.push(item);}); setAS(s=>s?.id===spId?{...s,tools:[...s.tools,item]}:s); toastFn(t("تم إضافة الأداة","Tool added")); };
  const updTool    = async (spId,id,f) => { await mut("updateTool",{id,...f},d=>{const s=d.specialties.find(x=>x.id===spId);if(s){const i=s.tools.findIndex(t=>t.id===id);if(i>=0)Object.assign(s.tools[i],f);}}); setAS(s=>s?.id===spId?{...s,tools:s.tools.map(t=>t.id===id?{...t,...f}:t)}:s); toastFn(t("تم التحديث","Updated")); };
  const delTool    = async (spId,id) => { await mut("deleteTool",{id},d=>{const s=d.specialties.find(x=>x.id===spId);if(s)s.tools=s.tools.filter(t=>t.id!==id);}); setAS(s=>s?.id===spId?{...s,tools:s.tools.filter(t=>t.id!==id)}:s); toastFn(t("تم الحذف","Deleted")); };
  const addProc    = async (spId,f) => { const id=gid(),item={...f,id,specialtyId:spId}; await mut("addProcedure",{specialtyId:spId,...f},d=>{const s=d.specialties.find(x=>x.id===spId);if(s)s.procedures.push(item);}); setAS(s=>s?.id===spId?{...s,procedures:[...s.procedures,item]}:s); toastFn(t("تم إضافة الإجراء","Procedure added")); };
  const updProc    = async (spId,id,f) => { await mut("updateProcedure",{id,...f},d=>{const s=d.specialties.find(x=>x.id===spId);if(s){const i=s.procedures.findIndex(p=>p.id===id);if(i>=0)Object.assign(s.procedures[i],f);}}); setAS(s=>s?.id===spId?{...s,procedures:s.procedures.map(p=>p.id===id?{...p,...f}:p)}:s); toastFn(t("تم التحديث","Updated")); };
  const delProc    = async (spId,id) => { await mut("deleteProcedure",{id},d=>{const s=d.specialties.find(x=>x.id===spId);if(s)s.procedures=s.procedures.filter(p=>p.id!==id);}); setAS(s=>s?.id===spId?{...s,procedures:s.procedures.filter(p=>p.id!==id)}:s); toastFn(t("تم الحذف","Deleted")); };
  const addIPC     = async f => { const id=gid(),item={...f,id,steps:[]}; await mut("addIPCModule",f,d=>d.ipcModules.push(item)); toastFn(t("تم الإضافة","Added")); };
  const updIPC     = async (id,f) => { await mut("updateIPCModule",{id,...f},d=>{const i=d.ipcModules.findIndex(m=>m.id===id);if(i>=0)Object.assign(d.ipcModules[i],f);}); if(activeIPC?.id===id)setAI(m=>({...m,...f})); toastFn(t("تم التحديث","Updated")); };
  const delIPC     = async id => { if(!confirm(t("حذف الوحدة؟","Delete module?")))return; await mut("deleteIPCModule",{id},d=>{d.ipcModules=d.ipcModules.filter(m=>m.id!==id);}); if(activeIPC?.id===id){setAI(null);setPage("dashboard");} toastFn(t("تم الحذف","Deleted")); };
  const addStep    = async (modId,f) => { const id=gid(),item={...f,id,moduleId:modId}; await mut("addIPCStep",{moduleId:modId,...f},d=>{const m=d.ipcModules.find(x=>x.id===modId);if(m)m.steps.push(item);}); setAI(m=>m?.id===modId?{...m,steps:[...m.steps,item]}:m); toastFn(t("تم الإضافة","Added")); };
  const updStep    = async (modId,id,f) => { await mut("updateIPCStep",{id,...f},d=>{const m=d.ipcModules.find(x=>x.id===modId);if(m){const i=m.steps.findIndex(s=>s.id===id);if(i>=0)Object.assign(m.steps[i],f);}}); setAI(m=>m?.id===modId?{...m,steps:m.steps.map(s=>s.id===id?{...s,...f}:s)}:m); toastFn(t("تم التحديث","Updated")); };
  const delStep    = async (modId,id) => { await mut("deleteIPCStep",{id},d=>{const m=d.ipcModules.find(x=>x.id===modId);if(m)m.steps=m.steps.filter(s=>s.id!==id);}); setAI(m=>m?.id===modId?{...m,steps:m.steps.filter(s=>s.id!==id)}:m); toastFn(t("تم الحذف","Deleted")); };
  const addQ       = async (gId,f) => { const id=gid(),item={...f,id,groupId:gId}; await mut("addQuiz",{groupId:gId,...f},d=>{if(!d.quizzes[gId])d.quizzes[gId]=[];d.quizzes[gId].push(item);}); toastFn(t("تم إضافة السؤال","Question added")); };
  const updQ       = async (gId,id,f) => { await mut("updateQuiz",{id,...f},d=>{if(d.quizzes[gId]){const i=d.quizzes[gId].findIndex(x=>x.id===id);if(i>=0)Object.assign(d.quizzes[gId][i],f);}}); toastFn(t("تم التحديث","Updated")); };
  const delQ       = async (gId,id) => { await mut("deleteQuiz",{id},d=>{if(d.quizzes[gId])d.quizzes[gId]=d.quizzes[gId].filter(x=>x.id!==id);}); toastFn(t("تم الحذف","Deleted")); };
  const addUser    = async f => { const id=gid(),item={...f,id}; await mut("addUser",f,d=>d.users.push(item)); toastFn(t("تم إضافة المستخدم","User added")); };
  const delUser    = async id => { if(id===user?.id){toastFn(t("لا يمكن حذف حسابك","Cannot delete own account"),"err");return;} await mut("deleteUser",{id},d=>{d.users=d.users.filter(u=>u.id!==id);}); toastFn(t("تم الحذف","Deleted")); };

  // ── STYLES (Admin: high-density, more professional, darker)
  const S = {
    app:  { direction:dir, fontFamily:lang==="ar"?"'Tajawal',sans-serif":"'Inter',sans-serif", background:"linear-gradient(150deg,#020508 0%,#050c18 55%,#040a14 100%)", minHeight:"100vh", color:"#e2e8f0" },
    hdr:  { position:"sticky", top:0, zIndex:100, background:"rgba(2,5,8,0.94)", backdropFilter:"blur(24px)", borderBottom:"1px solid rgba(139,92,246,0.18)", padding:"10px 18px", display:"flex", alignItems:"center", justifyContent:"space-between" },
    pg:   { padding:"18px 16px", maxWidth:960, margin:"0 auto" },

answer هو رقم الخيار الصحيح (0-3).`;

        // نرسل للـ GAS كـ proxy — يتجنب CORS
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "aiGenerate", prompt }),
          headers: { "Content-Type": "text/plain" }
        });
        const data = await res.json();

        const raw = data.result || "";

        const parsed = JSON.parse(jsonMatch[0]);
        applyGenerated(parsed);

          { qEn:"What does the VITA shade guide help determine?", qAr:"ماذا يساعد دليل ألوان VITA في تحديده؟", opts: [{en:"Crown color matching to natural teeth",ar:"مطابقة لون التاج للأسنان الطبيعية"},{en:"Crown size",ar:"حجم التاج"},{en:"Material strength",ar:"متانة المادة"},{en:"Occlusal clearance",ar:"خلوص الإطباق"}], ans:0 },
        ]},
        # ── Pediatric
        { keys: ["pedo","child","primary","ssc","أطفال","حليب","ختم"], qs: [
          { qEn:"What is the purpose of a Stainless Steel Crown (SSC) in pediatric dentistry?", qAr:"ما الغرض من التاج المعدني (SSC) في طب أسنان الأطفال؟", opts: [{en:"Restore and protect grossly decayed primary molars",ar:"ترميم وحماية أرحاء الحليب شديدة التسوس"},{en:"Aesthetic restoration only",ar:"ترميم جمالي فقط"},{en:"Space maintenance only",ar:"حافظ مسافة فقط"},{en:"Replace missing teeth",ar:"تعويض الأسنان المفقودة"}], ans:0 },
          { qEn:"When is a fissure sealant indicated?", qAr:"متى يُشار إلى ختم الشقوق؟", opts: [{en:"On caries-free newly erupted permanent molars",ar:"على أرحاء دائمة حديثة البزوغ خالية من التسوس"},{en:"On teeth with active caries",ar:"على الأسنان ذات التسوس النشط"},{en:"On primary teeth only",ar:"على أسنان الحليب فقط"},{en:"After root canal treatment",ar:"بعد علاج العصب"}], ans:0 },
        ]},
      ];

      // Match topic to knowledge base
      const topicLower = topicClean.toLowerCase();
      let matched = null;
      for (const kb of knowledgeBase) {
        if (kb.keys.some(k => topicLower.includes(k))) {
          matched = kb;
          break;
        }
      }

      let finalQs;
      if (matched && matched.qs.length >= 3) {
        // Use matched questions, pad with general if needed
        finalQs = [...matched.qs];
        // Add general questions if less than 5
        if (finalQs.length < 5) {
          const general = buildGeneral(topicClean);
          finalQs = [...finalQs, ...general].slice(0, 5);
        }
      } else {
        // No match — build general questions about the topic
        finalQs = buildGeneral(topicClean);
      }

      // Shuffle answer positions
      const shuffled = finalQs.map(q => {
        const correct = { en: q.opts[q.ans].en, ar: q.opts[q.ans].ar };
        const others  = q.opts.filter((_,i) => i !== q.ans);
        const pos     = Math.floor(Math.random() * 4);
        const reordered = [...others];
        reordered.splice(pos, 0, correct);
        return {
          questionAr:  q.qAr,
          questionEn:  q.qEn,
          optionsAr:   reordered.map(o => o.ar),
          optionsEn:   reordered.map(o => o.en),
          answer:      pos
        };
      });

      applyGenerated(shuffled);
    };

    const buildGeneral = (topic) => [
      { qEn:`What is the primary clinical purpose of ${topic}?`,
        qAr:`ما الغرض السريري الرئيسي من ${topic}؟`,
        opts:[{en:"Direct patient treatment application",ar:"التطبيق العلاجي المباشر للمريض"},{en:"Administrative record keeping",ar:"الحفظ الإداري للسجلات"},{en:"Laboratory analysis only",ar:"التحليل المختبري فقط"},{en:"Patient education only",ar:"تثقيف المريض فقط"}], ans:0 },
      { qEn:`Which sterilization method is required for ${topic} if it contacts sterile tissue?`,
        qAr:`أي طريقة تعقيم مطلوبة لـ ${topic} إذا لامست أنسجة معقمة؟`,
        opts:[{en:"Full sterilization via autoclave",ar:"تعقيم كامل بالأوتوكليف"},{en:"High-level disinfection",ar:"تطهير عالي المستوى"},{en:"Wipe with 70% alcohol",ar:"مسح بكحول 70%"},{en:"No processing required",ar:"لا معالجة مطلوبة"}], ans:0 },
      { qEn:`What PPE is mandatory when handling ${topic} chairside?`,
        qAr:`أي معدات وقاية إلزامية عند التعامل مع ${topic} بجانب كرسي الطبيب؟`,
        opts:[{en:"Gloves, mask, eye protection and gown",ar:"قفازات وكمامة ونظارة وجاون"},{en:"Gloves only",ar:"قفازات فقط"},{en:"Mask only",ar:"كمامة فقط"},{en:"No PPE needed",ar:"لا معدات وقاية مطلوبة"}], ans:0 },
      { qEn:`Before using ${topic} on a new patient, the dental nurse should verify:`,
        qAr:`قبل استخدام ${topic} مع مريض جديد، يجب على ممرضة الأسنان التحقق من:`,
        opts:[{en:"Sterilization packaging integrity and expiry date",ar:"سلامة التغليف وتاريخ انتهاء التعقيم"},{en:"The patient's insurance details",ar:"تفاصيل تأمين المريض"},{en:"The room temperature",ar:"درجة حرارة الغرفة"},{en:"The instrument color",ar:"لون الأداة"}], ans:0 },
      { qEn:`What should be documented after using ${topic} in a clinical procedure?`,
        qAr:`ما الذي يجب توثيقه بعد استخدام ${topic} في إجراء سريري؟`,
        opts:[{en:"Procedure details, batch number and sterilization record",ar:"تفاصيل الإجراء ورقم الدفعة وسجل التعقيم"},{en:"Patient's name only",ar:"اسم المريض فقط"},{en:"Time of procedure only",ar:"وقت الإجراء فقط"},{en:"No documentation needed",ar:"لا توثيق مطلوب"}], ans:0 },
    ];

    const addSelected = () => {
      generated.forEach((q, i) => {
        if (selected[i]) addQ(gId, q);
      });
      setAiModal(null);
      toastFn(t(`تم إضافة ${Object.values(selected).filter(Boolean).length} أسئلة ✓`,
               `Added ${Object.values(selected).filter(Boolean).length} questions ✓`));
    };

    const aiColors = { bg:"#0a0f1e", border:"rgba(168,85,247,0.3)", acc:"#a855f7" };

    return (
      <div style={S.mdlBg} onClick={e=>e.target===e.currentTarget&&setAiModal(null)}>
        <div style={{...S.mdl, maxWidth:560, background:aiColors.bg, borderColor:aiColors.border}}>
          {/* Header */}
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16}}>
            <div style={{display:"flex", alignItems:"center", gap:8}}>
              <span style={{fontSize:22}}>✨</span>
              <div>
                <div style={{fontWeight:900, fontSize:15, color:"#e9d5ff"}}>{t("توليد أسئلة بالذكاء الاصطناعي","AI Quiz Generator")}</div>
                <div style={{fontSize:11, color:"#7c3aed"}}>{GAS_OK() ? t("مشغّل بـ Claude AI","Powered by Claude AI") : t("توليد ذكي محلي + Claude عبر GAS","Smart local + Claude via GAS")}</div>
              </div>
            </div>
            <button onClick={()=>setAiModal(null)} style={S.del}>✕</button>
          </div>

          {/* Topic input */}
          <div style={{marginBottom:12}}>
            <label style={{...S.lbl, color:"#c4b5fd"}}>{t("الموضوع أو الأداة أو الإجراء","Topic / Tool / Procedure")}</label>
            <div style={{display:"flex", gap:8}}>
              <input style={{...S.inp, flex:1, borderColor:"rgba(168,85,247,0.3)", background:"rgba(168,85,247,0.08)"}}
                value={topic} onChange={e=>setTopic(e.target.value)}
                placeholder={t("مثال: مرآة الفحص واستخداماتها","e.g. Dental mirror and its uses")}
                onKeyDown={e=>e.key==="Enter"&&generate()}/>
              <button onClick={generate} disabled={loading||!topic.trim()}
                style={{padding:"8px 16px", borderRadius:8, border:"none", cursor:loading?"wait":"pointer",
                  fontWeight:800, fontSize:13, fontFamily:"inherit", whiteSpace:"nowrap",
                  background:loading?"rgba(168,85,247,0.3)":"linear-gradient(135deg,#7c3aed,#a855f7)",
                  color:"#fff", opacity:(!topic.trim()&&!loading)?0.5:1}}>
                {loading ? "⏳..." : t("✨ ولّد","✨ Generate")}
              </button>
            </div>
          </div>

          {err && <div style={{color:"#fca5a5", fontSize:12, marginBottom:10, padding:"8px 12px", borderRadius:8, background:"rgba(239,68,68,0.1)"}}>{err}</div>}

          {/* Loading state */}
          {loading && (
            <div style={{textAlign:"center", padding:28, color:"#c4b5fd"}}>
              <div style={{fontSize:32, marginBottom:8, animation:"spin 1s linear infinite"}}>✨</div>
              <div style={{fontSize:13}}>{t("جارٍ توليد الأسئلة بالذكاء الاصطناعي...","Generating AI questions...")}</div>
              <style>{`@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}`}</style>
            </div>
          )}

          {/* Generated questions */}
          {generated.length > 0 && (
            <div>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10}}>
                <div style={{fontSize:12, color:"#c4b5fd", fontWeight:700}}>
                  {t("اختر الأسئلة التي تريد إضافتها:","Select questions to add:")}
                  <span style={{color:"#a855f7", marginInlineStart:6}}>
                    {Object.values(selected).filter(Boolean).length}/{generated.length}
                  </span>
                </div>
                <button onClick={()=>setSelected(s=>{const n={};Object.keys(s).forEach(k=>n[k]=!Object.values(s).every(Boolean));return n;})}
                  style={{...S.sec("#a855f7"), fontSize:10}}>
                  {Object.values(selected).every(Boolean) ? t("إلغاء الكل","Deselect All") : t("تحديد الكل","Select All")}
                </button>
              </div>
              <div style={{maxHeight:320, overflowY:"auto", display:"flex", flexDirection:"column", gap:8}}>
                {generated.map((q, i) => (
                  <div key={i} onClick={()=>setSelected(s=>({...s,[i]:!s[i]}))}
                    style={{padding:"10px 12px", borderRadius:9, cursor:"pointer", border:`1px solid`,
                      borderColor:selected[i]?"rgba(168,85,247,0.5)":"rgba(255,255,255,0.07)",
                      background:selected[i]?"rgba(168,85,247,0.1)":"rgba(255,255,255,0.02)",
                      transition:"all 0.15s"}}>
                    <div style={{display:"flex", gap:8, alignItems:"flex-start"}}>
                      <div style={{width:18, height:18, borderRadius:4, border:`2px solid ${selected[i]?"#a855f7":"#475569"}`,
                        background:selected[i]?"#a855f7":"transparent", flexShrink:0, marginTop:1,
                        display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, color:"#fff"}}>
                        {selected[i]?"✓":""}
                      </div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:12, fontWeight:700, color:"#e2e8f0", marginBottom:4, lineHeight:1.5}}>
                          {lang==="ar" ? q.questionAr : q.questionEn}
                        </div>
                        <div style={{display:"flex", flexDirection:"column", gap:2}}>
                          {(lang==="ar" ? q.optionsAr : q.optionsEn).map((opt, oi) => (
                            <div key={oi} style={{fontSize:11, color: oi===q.answer?"#6ee7b7":"#64748b",
                              display:"flex", gap:5, alignItems:"center"}}>
                              <span style={{fontWeight:700}}>{String.fromCharCode(65+oi)}.</span>
                              <span>{opt}</span>
                              {oi===q.answer && <span style={{color:"#6ee7b7", fontSize:10}}>✓</span>}
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>

              {/* Add button */}
              <button onClick={addSelected}
                disabled={!Object.values(selected).some(Boolean)}
                style={{...S.pri, width:"100%", marginTop:12, background:"linear-gradient(135deg,#7c3aed,#a855f7)",
                  opacity:Object.values(selected).some(Boolean)?1:0.4}}>
                ➕ {t(`إضافة ${Object.values(selected).filter(Boolean).length} أسئلة`,
                      `Add ${Object.values(selected).filter(Boolean).length} Questions`)}
              </button>
            </div>
          )}
        </div>
      </div>
    );
  };

  // ── MODAL
  const EditModal = () => {
    if (!modal) return null;
    const {type, item, extra} = modal;
    const init = () => {
      if (type==="spec")    return {nameAr:item?.nameAr||"",nameEn:item?.nameEn||"",icon:item?.icon||"🦷",color:item?.color||"#38bdf8"};
      if (type==="tool")    return {nameAr:item?.nameAr||"",nameEn:item?.nameEn||"",useAr:item?.useAr||"",useEn:item?.useEn||""};
      if (type==="proc")    return {nameAr:item?.nameAr||"",nameEn:item?.nameEn||""};
      if (type==="ipcmod")  return {nameAr:item?.nameAr||"",nameEn:item?.nameEn||"",icon:item?.icon||"🛡",color:item?.color||"#60a5fa"};
      if (type==="ipcstep") return {textAr:item?.textAr||"",textEn:item?.textEn||""};
      if (type==="quiz")    return {questionAr:item?.questionAr||"",questionEn:item?.questionEn||"",optionsAr:(item?.optionsAr||["","","",""]).join("\n"),optionsEn:(item?.optionsEn||["","","",""]).join("\n"),answer:item?.answer||0};
      if (type==="user")    return {name:"",username:"",password:"",role:"nurse"};
      return {};
    };
    const [form, setForm] = useState(init);
    const set = (k,v) => setForm(f=>({...f,[k]:v}));
    const F = ({label,k,multi=false,inputType="text"}) => (
      <div style={{marginBottom:10}}>
        <label style={S.lbl}>{label}</label>
        {multi?<textarea style={S.ta} value={form[k]||""} onChange={e=>set(k,e.target.value)}/>
              :<input style={S.inp} type={inputType} value={form[k]||""} onChange={e=>set(k,e.target.value)}/>}
      </div>
    );
    const save = () => {
      if (type==="spec")    { item?updSpec(item.id,form):addSpec(form); }
      if (type==="tool")    { item?updTool(extra.spId,item.id,form):addTool(extra.spId,form); }
      if (type==="proc")    { item?updProc(extra.spId,item.id,form):addProc(extra.spId,form); }
      if (type==="ipcmod")  { item?updIPC(item.id,form):addIPC(form); }
      if (type==="ipcstep") { item?updStep(extra.modId,item.id,form):addStep(extra.modId,form); }
      if (type==="quiz") {
        const ar = form.optionsAr.split("\n").map(s=>s.trim()).filter(Boolean);
        const en = form.optionsEn.split("\n").map(s=>s.trim()).filter(Boolean);
        const q  = {...form, optionsAr:ar, optionsEn:en, answer:parseInt(form.answer)||0};
        item ? updQ(extra.gId,item.id,q) : addQ(extra.gId,q);
      }
      if (type==="user") { addUser(form); }
      setModal(null);
    };
    const titles = {spec:t("القسم","Specialty"),tool:t("أداة","Tool"),proc:t("إجراء","Procedure"),ipcmod:t("وحدة IPC","IPC Module"),ipcstep:t("خطوة","Step"),quiz:t("سؤال اختبار","Quiz Question"),user:t("مستخدم","User")};
    return (
      <div style={S.mdlBg} onClick={e=>e.target===e.currentTarget&&setModal(null)}>
        <div style={S.mdl}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <div style={{fontWeight:900,fontSize:14}}>{item?t("تعديل","Edit"):t("إضافة","Add")} — {titles[type]}</div>
            <button onClick={()=>setModal(null)} style={S.del}>✕</button>
          </div>
          {(type==="spec"||type==="tool"||type==="proc"||type==="ipcmod")&&<><F label={t("الاسم بالعربي","Name (Arabic)")} k="nameAr"/><F label={t("الاسم بالإنجليزي","Name (English)")} k="nameEn"/></>}
          {(type==="spec"||type==="ipcmod")&&<><F label={t("الأيقونة","Icon (emoji)")} k="icon"/><F label={t("اللون","Color (hex)")} k="color"/></>}
          {type==="tool"&&<><F label={t("الاستخدام بالعربي","Use (Arabic)")} k="useAr" multi/><F label={t("الاستخدام بالإنجليزي","Use (English)")} k="useEn" multi/></>}
          {type==="ipcstep"&&<><F label={t("النص بالعربي","Step text (Arabic)")} k="textAr" multi/><F label={t("النص بالإنجليزي","Step text (English)")} k="textEn" multi/></>}
          {type==="quiz"&&<>
            <F label={t("السؤال عربي","Question (Arabic)")} k="questionAr" multi/>
            <F label={t("السؤال إنجليزي","Question (English)")} k="questionEn" multi/>
            <F label={t("الخيارات عربي — سطر/خيار","Options Arabic — one per line")} k="optionsAr" multi/>
            <F label={t("الخيارات إنجليزي — سطر/خيار","Options English — one per line")} k="optionsEn" multi/>
            <div style={{marginBottom:10}}>
              <label style={S.lbl}>{t("رقم الإجابة الصحيحة (يبدأ من 0)","Correct answer index (0-based)")}</label>
              <input style={S.inp} type="number" min="0" max="3" value={form.answer||0} onChange={e=>set("answer",e.target.value)}/>
            </div>
          </>}
          {type==="user"&&<>
            <F label={t("الاسم الكامل","Full name")} k="name"/>
            <F label={t("اسم المستخدم","Username")} k="username"/>
            <F label={t("كلمة المرور","Password")} k="password" inputType="password"/>
            <div style={{marginBottom:10}}>
              <label style={S.lbl}>{t("الدور","Role")}</label>
              <select style={S.inp} value={form.role||"nurse"} onChange={e=>set("role",e.target.value)}>
                <option value="nurse">{t("ممرضة","Nurse")}</option>
                <option value="admin">{t("مدير","Admin")}</option>
              </select>
            </div>
          </>}
          <button onClick={save} style={{...S.pri,width:"100%",marginTop:6}}>{t("حفظ","Save")}</button>
        </div>
      </div>
    );
  };

  const AHeader = () => (
    <div style={S.hdr}>
      <div style={{display:"flex", alignItems:"center", gap:8}}>
        <span style={{fontSize:18}}>⚙️</span>
        <span style={S.logo}>{t("لوحة إدارة المنصة","Platform Admin Portal")}</span>
      </div>
      <div style={{display:"flex", gap:6, alignItems:"center", flexWrap:"wrap"}}>
        <span style={S.sync(sync)}>{sync==="ok"?t("✓ متزامن","✓ Synced"):sync==="syncing"?t("...","..."):sync==="error"?t("خطأ","Err"):t("محلي","Local")}</span>
        {GAS_OK()&&sync!=="syncing"&&<button onClick={()=>syncAll(token)} style={S.sec()}>🔄</button>}
        <button onClick={()=>setLang(l=>l==="ar"?"en":"ar")} style={S.sec()}>{lang==="ar"?"EN":"ع"}</button>
        <div style={{display:"flex", alignItems:"center", gap:6, padding:"4px 10px", borderRadius:8, background:"rgba(139,92,246,0.1)", border:"1px solid rgba(139,92,246,0.2)", fontSize:12}}>
          <span style={{color:"#a78bfa"}}>⚙️</span>
          <span style={{fontWeight:700, color:"#a78bfa"}}>{user.name}</span>
        </div>
        <button onClick={onLogout} style={{...S.sec(V.red), fontSize:11}}>↩ {t("خروج","Logout")}</button>
      </div>
    </div>
  );

  // ── SPECIALTY DETAIL PAGE (Admin)
  if (page==="spec_detail" && activeSpec) {
    const sp = activeSpec;
    const spQ = db.quizzes[sp.id] || [];
    return (
      <div style={S.app}><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
        {AHeader()}{toast&&<div style={S.tst(toast.type)}>{toast.msg}</div>}
        <EditModal/>
        <AIQuizModal/>
        <div style={S.pg}>
          <div style={S.back} onClick={()=>setPage("dashboard")}>‹ {t("لوحة التحكم","Dashboard")}</div>
          <div style={{...S.card, background:`linear-gradient(135deg,${sp.color}0e,${sp.color}03)`, border:`1px solid ${sp.color}22`, marginBottom:14}}>
            <div style={{display:"flex", alignItems:"center", gap:11, flexWrap:"wrap"}}>
              <span style={{fontSize:30}}>{sp.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:17, fontWeight:900}}>{t(sp.nameAr, sp.nameEn)}</div>
                <div style={{fontSize:11, color:V.muted}}>{t(sp.nameEn, sp.nameAr)}</div>
              </div>
              <div style={{display:"flex", gap:6}}>
                <button onClick={()=>setModal({type:"spec",item:sp})} style={S.edt}>✏️ {t("تعديل","Edit")}</button>
                <button onClick={()=>delSpec(sp.id)} style={S.del}>🗑 {t("حذف","Delete")}</button>
              </div>
            </div>
          </div>

          {/* Tools */}
          <div style={S.card}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:11}}>
              <div style={S.h2}>🔧 {t("الأدوات","Tools")} <span style={S.tag()}>{sp.tools?.length||0}</span></div>
              <button onClick={()=>setModal({type:"tool",item:null,extra:{spId:sp.id}})} style={S.sec()}>➕ {t("إضافة","Add")}</button>
            </div>
            {!(sp.tools?.length) && <div style={{color:V.muted,textAlign:"center",padding:14,fontSize:12}}>{t("لا توجد أدوات بعد","No tools yet")}</div>}
            {(sp.tools||[]).map((tool,i)=>(
              <div key={tool.id} style={S.row}>
                <span style={S.tag()}>{i+1}</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:13}}>{t(tool.nameAr,tool.nameEn)} <span style={{color:V.muted,fontSize:11}}>/ {t(tool.nameEn,tool.nameAr)}</span></div>
                  <div style={{fontSize:12,color:"#94a3b8",marginTop:2}}>🎯 {t(tool.useAr,tool.useEn)}</div>
                </div>
                <div style={{display:"flex",gap:5}}>
                  <button onClick={()=>setModal({type:"tool",item:tool,extra:{spId:sp.id}})} style={S.edt}>✏️</button>
                  <button onClick={()=>delTool(sp.id,tool.id)} style={S.del}>🗑</button>
                </div>
              </div>
            ))}
          </div>

          {/* Procedures */}
          <div style={S.card}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:11}}>
              <div style={S.h2}>📋 {t("الإجراءات","Procedures")} <span style={S.tag(V.grn)}>{sp.procedures?.length||0}</span></div>
              <button onClick={()=>setModal({type:"proc",item:null,extra:{spId:sp.id}})} style={S.sec(V.grn)}>➕ {t("إضافة","Add")}</button>
            </div>
            {!(sp.procedures?.length) && <div style={{color:V.muted,textAlign:"center",padding:14,fontSize:12}}>{t("لا توجد إجراءات","No procedures yet")}</div>}
            {(sp.procedures||[]).map((proc,i)=>(
              <div key={proc.id} style={S.row}>
                <span style={S.tag(V.grn)}>{i+1}</span>
                <span style={{flex:1,fontSize:13,fontWeight:600}}>{t(proc.nameAr,proc.nameEn)}</span>
                <div style={{display:"flex",gap:5}}>
                  <button onClick={()=>setModal({type:"proc",item:proc,extra:{spId:sp.id}})} style={S.edt}>✏️</button>
                  <button onClick={()=>delProc(sp.id,proc.id)} style={S.del}>🗑</button>
                </div>
              </div>
            ))}
          </div>

          {/* Quiz Questions */}
          <div style={S.card}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:11}}>
              <div style={S.h2}>🧪 {t("أسئلة الاختبار","Quiz Questions")} <span style={S.tag(V.yel)}>{spQ.length}</span></div>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>setAiModal({gId:sp.id, context:sp.nameAr})}
                  style={{padding:"5px 12px",borderRadius:7,border:"1px solid rgba(168,85,247,0.35)",cursor:"pointer",fontWeight:800,fontSize:11,background:"rgba(168,85,247,0.12)",color:"#c084fc",fontFamily:"inherit"}}>
                  ✨ {t("AI","AI")}
                </button>
                <button onClick={()=>setModal({type:"quiz",item:null,extra:{gId:sp.id}})} style={S.sec(V.yel)}>➕ {t("إضافة سؤال","Add Q")}</button>
              </div>
            </div>
            {spQ.map((q,i)=>(
              <div key={q.id} style={S.row}>
                <span style={S.tag(V.yel)}>{i+1}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,fontWeight:700}}>{t(q.questionAr,q.questionEn)}</div>
                  <div style={{fontSize:11,color:V.muted}}>✓ {t((q.optionsAr||[])[q.answer||0],(q.optionsEn||[])[q.answer||0])}</div>
                </div>
                <div style={{display:"flex",gap:5}}>
                  <button onClick={()=>setModal({type:"quiz",item:q,extra:{gId:sp.id}})} style={S.edt}>✏️</button>
                  <button onClick={()=>delQ(sp.id,q.id)} style={S.del}>🗑</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // ── IPC DETAIL PAGE (Admin)
  if (page==="ipc_detail" && activeIPC) {
    const mod = activeIPC;
    const qKey = "ipc_"+mod.id;
    const mQ   = db.quizzes[qKey] || [];
    return (
      <div style={S.app}><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
        {AHeader()}{toast&&<div style={S.tst(toast.type)}>{toast.msg}</div>}
        <EditModal/>
        <AIQuizModal/>
        <div style={S.pg}>
          <div style={S.back} onClick={()=>setPage("dashboard")}>‹ {t("لوحة التحكم","Dashboard")}</div>
          <div style={{...S.card, background:`linear-gradient(135deg,${mod.color}0e,${mod.color}03)`, border:`1px solid ${mod.color}22`}}>
            <div style={{display:"flex", alignItems:"center", gap:10, flexWrap:"wrap"}}>
              <span style={{fontSize:28}}>{mod.icon}</span>
              <div style={{flex:1}}><div style={{fontSize:16, fontWeight:900}}>{t(mod.nameAr, mod.nameEn)}</div></div>
              <div style={{display:"flex", gap:6}}>
                <button onClick={()=>setModal({type:"ipcmod",item:mod})} style={S.edt}>✏️</button>
                <button onClick={()=>delIPC(mod.id)} style={S.del}>🗑 {t("حذف","Del")}</button>
              </div>
            </div>
          </div>

          <div style={S.card}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:11}}>
              <div style={S.h2}>📝 {t("الخطوات","Steps")} <span style={S.tag(mod.color)}>{mod.steps?.length||0}</span></div>
              <button onClick={()=>setModal({type:"ipcstep",item:null,extra:{modId:mod.id}})} style={S.sec(mod.color)}>➕ {t("إضافة","Add")}</button>
            </div>
            {(mod.steps||[]).map((step,i)=>(
              <div key={step.id} style={S.step(mod.color)}>
                <span style={{...S.tag(mod.color), marginInlineEnd:8}}>{i+1}</span>
                <div style={{flex:1, fontSize:12, lineHeight:1.7}}>{t(step.textAr, step.textEn)}</div>
                <div style={{display:"flex", gap:5, flexShrink:0}}>
                  <button onClick={()=>setModal({type:"ipcstep",item:step,extra:{modId:mod.id}})} style={S.edt}>✏️</button>
                  <button onClick={()=>delStep(mod.id,step.id)} style={S.del}>🗑</button>
                </div>
              </div>
            ))}
          </div>

          <div style={S.card}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:11}}>
              <div style={S.h2}>🧪 {t("أسئلة الاختبار","Quiz Questions")} <span style={S.tag(V.yel)}>{mQ.length}</span></div>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>setAiModal({gId:qKey, context:mod.nameAr})}
                  style={{padding:"5px 12px",borderRadius:7,border:"1px solid rgba(168,85,247,0.35)",cursor:"pointer",fontWeight:800,fontSize:11,background:"rgba(168,85,247,0.12)",color:"#c084fc",fontFamily:"inherit"}}>
                  ✨ AI
                </button>
                <button onClick={()=>setModal({type:"quiz",item:null,extra:{gId:qKey}})} style={S.sec(V.yel)}>➕</button>
              </div>
            </div>
            {mQ.map((q,i)=>(
              <div key={q.id} style={S.row}>
                <span style={S.tag(V.yel)}>{i+1}</span>
                <div style={{flex:1, fontSize:12}}>{t(q.questionAr,q.questionEn)}</div>
                <div style={{display:"flex",gap:5}}>
                  <button onClick={()=>setModal({type:"quiz",item:q,extra:{gId:qKey}})} style={S.edt}>✏️</button>
                  <button onClick={()=>delQ(qKey,q.id)} style={S.del}>🗑</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // ── MAIN DASHBOARD
  const totalTools  = db.specialties.reduce((a,s)=>a+(s.tools?.length||0),0);
  const totalProcs  = db.specialties.reduce((a,s)=>a+(s.procedures?.length||0),0);
  const totalQs     = Object.values(db.quizzes).reduce((a,q)=>a+q.length,0);
  const nurses      = db.users.filter(u=>u.role==="nurse");
  const admins      = db.users.filter(u=>u.role==="admin");

  return (
    <div style={S.app}><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
      {AHeader()}{toast&&<div style={S.tst(toast.type)}>{toast.msg}</div>}
      <EditModal/>
      <div style={S.pg}>

        {/* KPI Row */}
        <div style={{...S.grid2, gridTemplateColumns:"repeat(4,1fr)", marginBottom:14}}>
          {[
            [db.specialties.length, t("قسم","Specialties"), "🦷", V.hi],
            [totalTools,            t("أداة","Tools"),       "🔧", V.pur],
            [totalProcs,            t("إجراء","Procedures"), "📋", V.grn],
            [totalQs,               t("سؤال اختبار","Quiz Qs"),"🧪", V.yel],
          ].map(([n,l,ic,c])=>(
            <div key={l} style={S.kpi(c)}>
              <div style={{fontSize:20, marginBottom:4}}>{ic}</div>
              <div style={{fontSize:22, fontWeight:900, color:c}}>{n}</div>
              <div style={{fontSize:10, color:V.muted}}>{l}</div>
            </div>
          ))}
        </div>

        {/* Tabs */}
        <div style={{display:"flex", gap:5, marginBottom:14, flexWrap:"wrap"}}>
          {["specialties","ipc","users","settings"].map(t2=>(
            <button key={t2} style={S.tab(tab===t2)} onClick={()=>setTab(t2)}>
              {t2==="specialties"?t("🦷 الأقسام","🦷 Specialties"):t2==="ipc"?t("🛡 IPC","🛡 IPC"):t2==="users"?t("👥 المستخدمون","👥 Users"):t("⚙️ إعدادات","⚙️ Settings")}
            </button>
          ))}
        </div>

        {/* SPECIALTIES TAB */}
        {tab==="specialties"&&<div>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:11}}>
            <div style={{fontWeight:800, fontSize:14}}>{t("الأقسام الطبية","Medical Specialties")} ({db.specialties.length})</div>
            <button onClick={()=>setModal({type:"spec",item:null})} style={S.sec()}>➕ {t("إضافة قسم","New Specialty")}</button>
          </div>
          {db.specialties.map(sp=>(
            <div key={sp.id} style={S.spR}>
              <span style={{fontSize:20}}>{sp.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:800,fontSize:13}}>{t(sp.nameAr, sp.nameEn)}</div>
                <div style={{fontSize:11,color:V.muted,display:"flex",gap:10,marginTop:2}}>
                  <span>🔧 {sp.tools?.length||0} {t("أداة","tools")}</span>
                  <span>📋 {sp.procedures?.length||0} {t("إجراء","procs")}</span>
                  <span>🧪 {(db.quizzes[sp.id]||[]).length} {t("سؤال","Qs")}</span>
                </div>
              </div>
              <div style={{display:"flex",gap:5}}>
                <button onClick={()=>{setAS(sp);setPage("spec_detail");}} style={S.sec()}>📂 {t("تفاصيل","Details")}</button>
                <button onClick={()=>setModal({type:"spec",item:sp})} style={S.edt}>✏️</button>
                <button onClick={()=>delSpec(sp.id)} style={S.del}>🗑</button>
              </div>
            </div>
          ))}
        </div>}

        {/* IPC TAB */}
        {tab==="ipc"&&<div>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:11}}>
            <div style={{fontWeight:800,fontSize:14}}>{t("وحدات مكافحة العدوى","Infection Control Modules")} ({db.ipcModules.length})</div>
            <button onClick={()=>setModal({type:"ipcmod",item:null})} style={S.sec()}>➕ {t("وحدة جديدة","New Module")}</button>
          </div>
          {db.ipcModules.map(mod=>(
            <div key={mod.id} style={S.spR}>
              <span style={{fontSize:20}}>{mod.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:800,fontSize:13}}>{t(mod.nameAr, mod.nameEn)}</div>
                <div style={{fontSize:11,color:V.muted,display:"flex",gap:10,marginTop:2}}>
                  <span>📝 {mod.steps?.length||0} {t("خطوة","steps")}</span>
                  <span>🧪 {(db.quizzes["ipc_"+mod.id]||[]).length} {t("سؤال","Qs")}</span>
                </div>
              </div>
              <div style={{display:"flex",gap:5}}>
                <button onClick={()=>{setAI(mod);setPage("ipc_detail");}} style={S.sec()}>📂 {t("تفاصيل","Details")}</button>
                <button onClick={()=>setModal({type:"ipcmod",item:mod})} style={S.edt}>✏️</button>
                <button onClick={()=>delIPC(mod.id)} style={S.del}>🗑</button>
              </div>
            </div>
          ))}
        </div>}

        {/* USERS TAB */}
        {tab==="users"&&<div>
          <div style={{...S.grid2, marginBottom:12}}>
            {[[nurses.length,t("ممرضة","Nurses"),V.grn,"👩‍⚕️"],[admins.length,t("مدير","Admins"),V.pur,"⚙️"]].map(([n,l,c,ic])=>(
              <div key={l} style={S.kpi(c)}><div style={{fontSize:22}}>{ic}</div><div style={{fontSize:20,fontWeight:900,color:c}}>{n}</div><div style={{fontSize:11,color:V.muted}}>{l}</div></div>
            ))}
          </div>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:11}}>
            <div style={{fontWeight:800,fontSize:13}}>{t("قائمة المستخدمين","User List")} ({db.users.length})</div>
            <button onClick={()=>setModal({type:"user",item:null})} style={S.sec()}>➕ {t("مستخدم جديد","New User")}</button>
          </div>
          {db.users.map(u=>(
            <div key={u.id} style={S.spR}>
              <div style={{width:32,height:32,borderRadius:"50%",background:u.role==="admin"?"rgba(139,92,246,0.2)":"rgba(52,211,153,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>
                {u.role==="admin"?"⚙️":"👩‍⚕️"}
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:13}}>{u.name}</div>
                <div style={{fontSize:11,color:V.muted}}>@{u.username}</div>
              </div>
              <span style={S.tag(u.role==="admin"?V.pur:V.grn)}>{u.role}</span>
              {u.id!==user?.id&&<button onClick={()=>delUser(u.id)} style={S.del}>🗑</button>}
            </div>
          ))}
        </div>}

        {/* SETTINGS TAB */}
        {tab==="settings"&&<div>
          <div style={S.card}>
            <div style={{fontWeight:900,marginBottom:11,fontSize:13}}>🔗 {t("إعدادات GAS","GAS Connection")}</div>
            <div style={{background:"rgba(0,0,0,0.3)",padding:"8px 12px",borderRadius:8,fontSize:11,color:"#94a3b8",wordBreak:"break-all",marginBottom:10}}>{GAS_URL}</div>
            <span style={S.tag(GAS_OK()?V.grn:V.yel)}>{GAS_OK()?t("✓ متصل","✓ Connected"):t("⚠️ غير مضبوط","⚠️ Not configured")}</span>
          </div>
          <div style={S.card}>
            <div style={{fontWeight:800,marginBottom:10,fontSize:13}}>📋 {t("خطوات الربط","Setup Steps")}</div>
            {[
              t("1. افتح Code.gs في Google Apps Script","1. Open Code.gs in Google Apps Script"),
              t("2. ضع معرّف الـ Spreadsheet في SS_ID","2. Set your Spreadsheet ID in SS_ID"),
              t("3. شغّل دالة setupSpreadsheet() مرة واحدة","3. Run setupSpreadsheet() once from editor"),
              t("4. انشر: Deploy > New deployment > Web App","4. Deploy > New deployment > Web app"),
              t("5. Execute as: Me | Who has access: Anyone","5. Execute as: Me | Who has access: Anyone"),
              t("6. انسخ رابط النشر وضعه في GAS_URL بهذا الملف","6. Paste the Deployment URL into GAS_URL in this file"),
            ].map((s,i)=><div key={i} style={{fontSize:12,color:"#94a3b8",marginBottom:6}}>• {s}</div>)}
          </div>
          <div style={S.card}>
            <div style={{fontWeight:800,marginBottom:8,fontSize:13}}>📊 {t("هيكل Google Sheets","Sheets Structure")}</div>
            {["Users","Specialties","Tools","Procedures","IPC_Modules","IPC_Steps","Quizzes","Logs"].map(sh=>(
              <div key={sh} style={{...S.row,padding:"5px 0"}}><span style={S.tag()}>{sh}</span></div>
            ))}
          </div>
        </div>}
      </div>
    </div>
  );
}

    // Mount — loading screen is hidden from inside App via useEffect
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
