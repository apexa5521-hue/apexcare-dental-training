xtAr":"4️⃣ واقي العينين أو الدرع الوجهي: ضعه فوق الكمامة","textEn":"4️⃣ Eye protection or face shield: place over mask","textUr":"٤ آنکھوں کا تحفظ یا فیس شیلڈ: ماسک کے اوپر لگائیں","textId":"4️⃣ Pelindung mata atau pelindung wajah: pasang di atas masker"},{"id":"dn5","moduleId":"donning","textAr":"5️⃣ القفازات أخيراً: ارتدِها بحيث تغطي أسفل كم الجاون","textEn":"5️⃣ Gloves LAST: ensure cuffs cover gown sleeves","textUr":"٥ دستانے آخر میں: پہنیں تاکہ گاؤن کی آستین ڈھک جائے","textId":"5️⃣ Sarung tangan TERAKHIR: pastikan menutupi manset gaun"},{"id":"dn6","moduleId":"donning","textAr":"🔁 التسلسل: يدان ← جاون ← كمامة ← نظارة ← قفازات","textEn":"🔁 Correct sequence: Hands → Gown → Mask → Eye Protection → Gloves","textUr":"ترتیب: ہاتھ ← گاؤن ← ماسک ← چشمہ ← دستانے","textId":"🔁 Urutan: Tangan → Gaun → Masker → Pelindung Mata → Sarung Tangan"}],"nameUr":"حفاظتی آلات پہننا (Donning)","nameId":"Memakai APD (Donning)"},{"id":"doffing","nameAr":"خلع معدات الوقاية (Doffing)","nameEn":"Doffing Personal Protective Equipment","icon":"🚫","color":"#ef4444","steps":[{"id":"df1","moduleId":"doffing","textAr":"⚠️ أخطر خطوة — معظم التلوث يحدث هنا! ابقِ يديك بعيداً عن وجهك","textEn":"⚠️ HIGHEST RISK STEP — most contamination occurs here! Hands away from face always","textUr":"خطرناک ترین مرحلہ — زیادہ تر آلودگی یہاں ہوتی ہے! ہاتھ چہرے سے دور رکھیں","textId":"⚠️ TAHAP RISIKO TERTINGGI — kontaminasi paling banyak terjadi di sini! Jauhkan tangan dari wajah"},{"id":"df2","moduleId":"doffing","textAr":"1️⃣ القفازات: اقرص الخارجي بعيداً عن الجلد وبادله من الداخل للخارج","textEn":"1️⃣ Gloves: pinch outer surface away from skin, peel inside-out","textUr":"١ دستانے: باہری سطح جلد سے دور پکڑ کر اندر سے باہر اتاریں","textId":"1️⃣ Sarung tangan: cubit permukaan luar, lepas dari dalam ke luar"},{"id":"df3","moduleId":"doffing","textAr":"2️⃣ نظّف يديك بالكحول فوراً بعد خلع القفازات","textEn":"2️⃣ Sanitize hands IMMEDIATELY after glove removal","textUr":"٢ دستانے اتارتے ہی فوری ہاتھ صاف کریں","textId":"2️⃣ Sanitasi tangan SEGERA setelah melepas sarung tangan"},{"id":"df4","moduleId":"doffing","textAr":"3️⃣ الجاون: اخلعه لفاً من الأمام للخلف — الجزء الملوث للداخل","textEn":"3️⃣ Gown: roll front-to-back, keeping contaminated surface folded inside","textUr":"٣ گاؤن: آگے سے پیچھے رول کریں — آلودہ حصہ اندر","textId":"3️⃣ Gaun: gulung depan ke belakang, sisi terkontaminasi di dalam"},{"id":"df5","moduleId":"doffing","textAr":"4️⃣ نظّف يديك مرة أخرى بالكحول","textEn":"4️⃣ Sanitize hands again with alcohol rub","textUr":"٤ دوبارہ الکوحل سے ہاتھ صاف کریں","textId":"4️⃣ Sanitasi tangan kembali dengan handrub alkohol"},{"id":"df6","moduleId":"doffing","textAr":"5️⃣ الدرع/النظارة: اخلعها من الأربطة الخلفية دون لمس الأمام","textEn":"5️⃣ Face shield/goggles: remove by back straps — do NOT touch front surface","textUr":"٥ فیس شیلڈ/چشمہ: پچھلی پٹیوں سے اتاریں — سامنے نہ چھوئیں","textId":"5️⃣ Pelindung wajah: lepas dari tali belakang — JANGAN sentuh bagian depan"},{"id":"df7","moduleId":"doffing","textAr":"6️⃣ الكمامة: اخلعها من الأربطة دون لمس الجزء الأمامي أبداً","textEn":"6️⃣ Mask: remove by ear loops/ties — do NOT touch front of mask","textUr":"٦ ماسک: پٹیوں سے اتاریں — سامنی حصہ نہ چھوئیں","textId":"6️⃣ Masker: lepas dari tali/kait telinga — JANGAN sentuh bagian depan masker"},{"id":"df8","moduleId":"doffing","textAr":"7️⃣ اغسل يديك نهائياً بالماء والصابون — 40 إلى 60 ثانية","textEn":"7️⃣ Final handwash with soap & water — 40–60 seconds","textUr":"٧ آخر میں صابن اور پانی سے ہاتھ دھوئیں — ٤٠ سے ٦٠ سیکنڈ","textId":"7️⃣ Cuci tangan akhir dengan sabun & air — 40–60 detik"},{"id":"df9","moduleId":"doffing","textAr":"🔁 التسلسل: قفازات ← يدان ← جاون ← يدان ← نظارة ← كمامة ← يدان","textEn":"🔁 Sequence: Gloves → Hands → Gown → Hands → Eye Prot. → Mask → Hands","textUr":"ترتیب: دستانے ← ہاتھ ← گاؤن ← ہاتھ ← چشمہ ← ماسک ← ہاتھ","textId":"🔁 Urutan: Sarung Tangan → Tangan → Gaun → Tangan → Pelindung Mata → Masker → Tangan"}],"nameUr":"حفاظتی آلات اتارنا (Doffing)","nameId":"Melepas APD (Doffing)"},{"id":"five_moments","nameAr":"اللحظات الخمس لنظافة اليدين (WHO)","nameEn":"WHO 5 Moments for Hand Hygiene","icon":"⏱","color":"#f59e0b","steps":[{"id":"fm1","moduleId":"five_moments","textAr":"اللحظة 1️⃣ — قبل لمس المريض: لحماية المريض من ميكروبات يديك","textEn":"Moment 1️⃣ — BEFORE touching a patient: protect patient from germs on your hands","textUr":"لمحہ ١ — مریض کو چھونے سے پہلے: مریض کو آپ کے ہاتھوں کے جراثیم سے بچائیں","textId":"Momen 1️⃣ — SEBELUM menyentuh pasien: lindungi pasien dari kuman di tangan Anda"},{"id":"fm2","moduleId":"five_moments","textAr":"اللحظة 2️⃣ — قبل الإجراء النظيف أو المعقم","textEn":"Moment 2️⃣ — BEFORE a clean or aseptic procedure","textUr":"لمحہ ٢ — صاف یا جراثیم سے پاک طریقہ کار سے پہلے","textId":"Momen 2️⃣ — SEBELUM prosedur bersih atau aseptik"},{"id":"fm3","moduleId":"five_moments","textAr":"اللحظة 3️⃣ — بعد التعرض لسوائل الجسم (دم، لعاب، إفرازات)","textEn":"Moment 3️⃣ — AFTER body fluid exposure risk (blood, saliva, secretions)","textUr":"لمحہ ٣ — جسمانی رطوبات سے تعرض کے بعد (خون، تھوک)","textId":"Momen 3️⃣ — SETELAH risiko terpapar cairan tubuh (darah, air liur)"},{"id":"fm4","moduleId":"five_moments","textAr":"اللحظة 4️⃣ — بعد لمس المريض","textEn":"Moment 4️⃣ — AFTER touching a patient","textUr":"لمحہ ٤ — مریض کو چھونے کے بعد","textId":"Momen 4️⃣ — SETELAH menyentuh pasien"},{"id":"fm5","moduleId":"five_moments","textAr":"اللحظة 5️⃣ — بعد لمس محيط المريض حتى بدون لمسه مباشرة","textEn":"Moment 5️⃣ — AFTER touching patient surroundings (even without direct patient contact)","textUr":"لمحہ ٥ — مریض کے ماحول کو چھونے کے بعد — براہ راست چھوئے بغیر بھی","textId":"Momen 5️⃣ — SETELAH menyentuh lingkungan pasien (meski tanpa kontak langsung)"},{"id":"fm6","moduleId":"five_moments","textAr":"📌 في طب الأسنان: القفازات لا تُغني أبداً عن نظافة اليدين","textEn":"📌 In dentistry: Gloves NEVER replace hand hygiene — always perform both","textUr":"دندان سازی میں: دستانے ہاتھ کی صفائی کی جگہ کبھی نہیں لے سکتے","textId":"📌 Dalam kedokteran gigi: Sarung tangan TIDAK PERNAH menggantikan kebersihan tangan"}],"nameUr":"ہاتھ کی صفائی کے پانچ لمحات (WHO)","nameId":"5 Momen Kebersihan Tangan WHO"},{"id":"sterilization","nameAr":"التعقيم ومكافحة العدوى","nameEn":"Sterilization & Infection Control","icon":"🔬","color":"#8b5cf6","steps":[{"id":"sr1","moduleId":"sterilization","textAr":"📦 مستويات المعالجة: تعقيم كامل ← مستوى عالٍ ← متوسط ← منخفض","textEn":"📦 Processing levels: Full Sterilization → High → Intermediate → Low-level disinfection","textUr":"مکمل جراثیم کشی ← اعلی سطح ← درمیانی ← کم سطح","textId":"📦 Tingkat pemrosesan: Sterilisasi → Tinggi → Menengah → Disinfeksi Rendah"},{"id":"sr2","moduleId":"sterilization","textAr":"🔧 الأدوات الحيوية (مبارد، كاشطات، شنبر): أوتوكليف Class B — 134°C / 18 دقيقة","textEn":"🔧 Critical instruments (files, curettes, handpiece): Class B Autoclave — 134°C / 18 min","textUr":"اہم آلات: کلاس بی آٹوکلیو — ١٣٤ ڈگری سیلشیس / ١٨ منٹ","textId":"🔧 Instrumen kritis: Autoklaf Kelas B — 134°C / 18 menit"},{"id":"sr3","moduleId":"sterilization","textAr":"🧹 الأسطح والوحدة: تطهير بكحول 70% أو هايبوكلوريت 0.5% بعد كل مريض","textEn":"🧹 Surfaces and dental unit: disinfect with 70% alcohol or 0.5% hypochlorite after each patient","textUr":"سطحیں: ہر مریض کے بعد ٧٠٪ الکوحل یا ہائپوکلورائٹ سے صاف کریں","textId":"🧹 Permukaan: disinfeksi dengan alkohol 70% atau hipoklorit setelah setiap pasien"},{"id":"sr4","moduleId":"sterilization","textAr":"🛡 الحواجز الواقية: تغطية الأزرار والخراطيم بالبلاستيك وتغييرها بين كل مريض","textEn":"🛡 Barriers: plastic-wrap buttons and tubing, change between every patient","textUr":"رکاوٹیں: بٹن اور ٹیوب کو پلاسٹک سے ڈھکیں — ہر مریض کے بعد بدلیں","textId":"🛡 Barrier: tutup tombol dan selang dengan plastik, ganti setiap pasien"},{"id":"sr5","moduleId":"sterilization","textAr":"📋 التتبع: ترقيم الحزم + مؤشرات كيميائية مع كل دفعة + اختبار جراثيم أسبوعياً","textEn":"📋 Tracking: package numbering + chemical indicators every load + weekly spore test","textUr":"ٹریکنگ: پیکیج نمبرنگ + کیمیکل انڈیکیٹر + ہفتہ وار جرثومہ ٹیسٹ","textId":"📋 Pelacakan: penomoran paket + indikator kimia + uji spora mingguan"},{"id":"sr6","moduleId":"sterilization","textAr":"🗑 الأدوات الحادة: حاويات خاصة — يُمنع منعاً باتاً إعادة الغطاء بيد واحدة","textEn":"🗑 Sharps: dedicated containers — NEVER recap needles single-handed under any circumstance","textUr":"تیز آلات: خاص ڈبے — سوئی کو ایک ہاتھ سے دوبارہ ڈھانپنا بالکل منع ہے","textId":"🗑 Benda tajam: wadah khusus — JANGAN menutup jarum dengan satu tangan"}],"nameUr":"جراثیم کشی اور انفیکشن کنٹرول","nameId":"Sterilisasi & Pengendalian Infeksi"},{"id":"handwash","nameAr":"غسل اليدين الصحيح — خطوات WHO","nameEn":"Correct Handwashing Technique — WHO Steps","icon":"🚿","color":"#10b981","steps":[{"id":"hw1","moduleId":"handwash","textAr":"1️⃣ ابلل يديك بالماء الجاري ثم ضع الصابون على راحتيهما","textEn":"1️⃣ Wet hands under running water, apply soap to palms","textUr":"١ بہتے پانی سے ہاتھ گیلے کریں پھر صابن لگائیں","textId":"1️⃣ Basahi tangan di bawah air mengalir, oleskan sabun"},{"id":"hw2","moduleId":"handwash","textAr":"2️⃣ افرك كف اليد على الأخرى في حركات دائرية","textEn":"2️⃣ Rub palm to palm in circular motions","textUr":"٢ ہتھیلی پر ہتھیلی گول حرکت میں رگڑیں","textId":"2️⃣ Gosok telapak ke telapak dengan gerakan melingkar"},{"id":"hw3","moduleId":"handwash","textAr":"3️⃣ افرك ظهر كل يد بكف الأخرى بأصابع متشابكة","textEn":"3️⃣ Rub back of each hand with interlaced fingers of opposite hand","textUr":"٣ دوسرے ہاتھ کی انگلیوں سے ہر ہاتھ کی پشت رگڑیں","textId":"3️⃣ Gosok punggung tangan dengan jari-jari yang saling mengunci"},{"id":"hw4","moduleId":"handwash","textAr":"4️⃣ افرك بين الأصابع — كف على كف بأصابع متشابكة","textEn":"4️⃣ Interlace fingers palm to palm and rub between them","textUr":"٤ انگلیوں کو آپس میں ملائیں اور درمیان رگڑیں","textId":"4️⃣ Jalinan jari telapak ke telapak, gosok di antaranya"},{"id":"hw5","moduleId":"handwash","textAr":"5️⃣ افرك ظهر الأصابع على الكف المقابل","textEn":"5️⃣ Rub backs
