<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NSE — عينة المذاكرة</title><style>
:root{--green:#34834f;--ink:#244332;--bg:#f7faf3;--line:#dfe8d8;--surface:#fff;--muted:#607364}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.85}button,select{font:inherit;cursor:pointer;min-height:48px;border-radius:13px;padding:10px 20px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}button:focus-visible,select:focus-visible{outline:3px solid #3089a6;outline-offset:4px}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--green);border-color:#28653c;border-bottom-width:5px;color:white;font-weight:750}header{max-width:1080px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:20px 24px;gap:16px;flex-wrap:wrap}.logo{font-size:27px;font-weight:900;color:var(--green)}.sample{font-size:12px;background:#fff2cf;color:#775b24;border-radius:9px;padding:6px 12px}main{max-width:1000px;margin:5px auto 40px;padding:20px}.topline{display:flex;justify-content:space-between;gap:15px;align-items:center}.track{height:13px;background:var(--line);border-radius:20px;overflow:hidden;margin:15px 0 26px}.fill{height:100%;background:linear-gradient(90deg,#3a9e62,#a5d776);border-radius:20px;transition:width .25s}.lesson{border:2px solid var(--line);border-bottom-width:5px;border-radius:27px;background:var(--surface);padding:clamp(23px,5vw,48px)}.eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--green);font-weight:bold}h1{font-size:clamp(25px,4vw,37px);line-height:1.45;letter-spacing:-.6px;margin:13px 0 20px}h2{font-size:22px;margin:12px 0}p{font-size:17px;color:var(--muted)}.visual{height:180px;display:grid;place-items:center;border-radius:23px;background:#edf7e7;margin:24px 0;position:relative;overflow:hidden}.visual svg{width:240px;height:155px}.callout{background:#edf7e7;border-radius:16px;padding:18px 22px;color:#35583d;margin:20px 0}.choice{width:100%;text-align:start;margin:7px 0;padding:16px 20px;border-bottom-width:4px}.choice.selected{border-color:#62a473;background:#edf7e7}.feedback{border-inline-start:4px solid var(--green);background:#edf7e7;padding:17px 20px;border-radius:12px;margin-top:18px}footer{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-top:27px;flex-wrap:wrap}.dots{display:flex;gap:8px}.dot{width:9px;height:9px;background:var(--line);border-radius:50%}.dot.active{background:var(--green)}.muted{color:var(--muted);font-size:13px}.knowledge{border:2px solid #c6dcc2;border-radius:23px;background:linear-gradient(145deg,#fff,#eff7e9);padding:25px;margin-top:22px}.knowledge .label{font-size:10px;letter-spacing:2px;color:var(--green)}.knowledge li{margin:12px 0}a{color:var(--green)}.lesson[hidden]{display:none}#library{display:grid;gap:15px}.course-tile{display:flex;gap:20px;align-items:center;justify-content:space-between;padding:22px;border:2px solid var(--line);border-radius:20px;background:white}.course-tile strong{font-size:20px}.toast{padding:16px;background:#fff3d8;border-radius:13px;margin:20px 0}.center{text-align:center}.seal{font-size:48px;color:var(--green)}[hidden]{display:none!important}@media(max-width:550px){header{padding:16px}.lesson{padding:24px 20px}main{padding:12px}p{font-size:15px}.visual{height:150px}.primary{padding-inline:24px}.topline{font-size:13px}footer{gap:10px}footer .primary{flex:1}header button,header select{padding:7px 12px;font-size:12px}h1{font-size:27px}.course-tile{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><span class="logo">NSE <span style="font-size:12px;font-weight:500">Learn · Practice · Grow</span></span><span class="sample" id="sampleLabel">عينة مذاكرة · محتوى غير معتمد</span><select id="language" aria-label="Learning language"><option value="ar">العربية</option><option value="en">English</option><option value="ur">اردو</option><option value="id">Bahasa Indonesia</option></select></header><main><div class="topline"><button id="backLibrary">العودة للمكتبة</button><span id="stepText" class="muted"></span></div><div class="track"><div class="fill" id="fill"></div></div><div id="screen" class="lesson"></div><footer id="navigation"><button id="previous">السابق</button><div class="dots" id="dots"></div><button id="next" class="primary">التالي</button></footer><p class="muted" id="saved" aria-live="polite"></p><p class="muted" id="disclaimer"></p></main><script>
const lesson={"translations": {"ar": {"title": "نظافة اليدين عند الانتقال بين المهام", "body": "الهدف\nميّزي توقيت نظافة اليدين واختيار الوسيلة المناسبة.\n\nالشرح\nنظافة اليدين مطلوبة قبل لمس المريض، وقبل المهمة النظيفة أو المعقمة، وبعد التعرض للسوائل أو لمس المريض ومحيطه، وبعد خلع القفازات. عندما تكون اليدان متسختين بوضوح، استخدمي الماء والصابون. في أغلب المواقف السريرية الأخرى يُفضّل المستحضر الكحولي وفق سياسة المنشأة وتعليمات المنتج. القفازات لا تستبدل نظافة اليدين.\n\nنشاط تدريبي\nراجعي سيناريو انتقالك من خلع القفازات إلى لمس درج نظيف. حددي نقطة نظافة اليدين قبل فتح الدرج.\n\nملاحظة للمشرفة\nهذه مسودة تعليمية تحتاج مراجعة سريرية ولغوية واعتماد سياسة المركز. لا تمنح كفاءة عملية بمجرد إكمال القراءة.", "objective": "ميّزي توقيت نظافة اليدين واختيار الوسيلة المناسبة.", "activity": "راجعي سيناريو انتقالك من خلع القفازات إلى لمس درج نظيف. حددي نقطة نظافة اليدين قبل فتح الدرج."}, "en": {"title": "Hand hygiene between care tasks", "body": "Objective\nRecognize hand-hygiene opportunities and choose the appropriate method.\n\nLesson\nClean hands before patient contact and an aseptic task, after body-fluid exposure or contact with the patient or surroundings, and after glove removal. Use soap and water for visibly soiled hands. Alcohol-based hand rub is generally preferred otherwise, following facility policy and product instructions. Gloves do not replace hand hygiene.\n\nPractice activity\nReview a transition from removing gloves to opening a clean drawer. Identify when to clean your hands.\n\nSupervisor review\nThis draft needs clinical and language review and alignment with center policy. Reading completion alone does not establish practical competency.", "objective": "Recognize hand-hygiene opportunities and choose the appropriate method.", "activity": "Review a transition from removing gloves to opening a clean drawer. Identify when to clean your hands."}, "ur": {"title": "نگہداشت کے کاموں کے درمیان ہاتھوں کی صفائی", "body": "مقصد\nہاتھ صاف کرنے کے مواقع اور مناسب طریقہ پہچانیں۔\n\nسبق\nمریض کو چھونے اور جراثیم سے پاک کام سے پہلے، جسمانی رطوبتوں یا مریض اور اس کے ماحول سے رابطے کے بعد، اور دستانے اتارنے کے بعد ہاتھ صاف کریں۔ واضح گندگی پر صابن اور پانی استعمال کریں۔ دیگر اکثر طبی حالات میں ادارے کی پالیسی اور مصنوعات کی ہدایات کے مطابق الکحل والا ہینڈ رب ترجیحی ہے۔ دستانے ہاتھوں کی صفائی کا متبادل نہیں۔\n\nتربیتی سرگرمی\nدستانے اتارنے کے بعد صاف دراز کھولنے کا منظر دیکھیں۔ ہاتھ صاف کرنے کا وقت بتائیں۔\n\nسپروائزر کا جائزہ\nاس مسودے کا طبی اور لسانی جائزہ اور مرکز کی پالیسی سے مطابقت ضروری ہے۔ صرف پڑھنا عملی اہلیت ثابت نہیں کرتا۔", "objective": "ہاتھ صاف کرنے کے مواقع اور مناسب طریقہ پہچانیں۔", "activity": "دستانے اتارنے کے بعد صاف دراز کھولنے کا منظر دیکھیں۔ ہاتھ صاف کرنے کا وقت بتائیں۔"}, "id": {"title": "Kebersihan tangan antar tindakan", "body": "Tujuan\nKenali waktu kebersihan tangan dan pilih metode yang sesuai.\n\nMateri\nBersihkan tangan sebelum menyentuh pasien dan tindakan aseptik, setelah paparan cairan tubuh atau menyentuh pasien dan lingkungannya, serta setelah melepas sarung tangan. Gunakan sabun dan air bila tangan tampak kotor. Pada kebanyakan situasi lain, handrub berbasis alkohol diutamakan sesuai kebijakan fasilitas dan petunjuk produk. Sarung tangan tidak menggantikan kebersihan tangan.\n\nKegiatan latihan\nTinjau perpindahan dari melepas sarung tangan ke membuka laci bersih. Tentukan kapan harus membersihkan tangan.\n\nTinjauan supervisor\nDraf ini memerlukan tinjauan klinis dan bahasa serta kesesuaian kebijakan pusat. Menyelesaikan bacaan tidak membuktikan kompetensi praktik.", "objective": "Kenali waktu kebersihan tangan dan pilih metode yang sesuai.", "activity": "Tinjau perpindahan dari melepas sarung tangan ke membuka laci bersih. Tentukan kapan harus membersihkan tangan."}}, "sourceUrls": ["https://www.cdc.gov/clean-hands/hcp/clinical-safety/"]};const $=id=>document.getElementById(id);let lang='ar',step=0,done=false,choice=null;try{const x=JSON.parse(localStorage.getItem('nse-study-sample')||'null');if(x){step=Math.max(0,Math.min(4,Number(x.step)||0));done=!!x.done}}catch{}
const T={ar:{sample:'عينة مذاكرة · محتوى غير معتمد',back:'العودة للمكتبة',prev:'السابق',next:'التالي',finish:'إكمال العينة',step:'الخطوة',of:'من',goal:'ماذا ستتعلمين؟',idea:'الفكرة الأساسية',practice:'جرّبي اتخاذ القرار',activity:'نشاط مع المشرفة',summary:'بطاقة المعرفة للمراجعة',question:'بعد خلع القفازات، ستفتحين درجًا نظيفًا. ما الخطوة المناسبة قبل لمسه؟',choices:['تنفيذ نظافة اليدين','فتح الدرج بالقفازات المستخدمة','تجاوز الخطوة لأن المهمة قصيرة'],feedback:['صحيح. نفذي نظافة اليدين قبل الانتقال إلى لمس الأدوات أو الأسطح النظيفة.','راجعي الانتقال من الملوث إلى النظيف. القفازات لا تستبدل نظافة اليدين.'],check:'راجعي اختياري',pending:'اختاري إجابة ثم راجعي التوضيح. هذا نشاط تعليمي وليس اختبارًا رسميًا.',saved:'تُحفظ آخر خطوة على هذا الجهاز للعينة فقط؛ لا تُرسل بيانات للمنصة.',disclaimer:'مسودة تعليمية تحتاج مراجعة سريرية ولغوية وسياسة المركز. لا تنشئ هذه العينة نتيجة اختبار أو بطاقة كفاءة فعلية.',done:'أحسنتِ، اكتملت العينة!',again:'راجعي الدرس مرة أخرى',open:'ابدئي الدرس',source:'المصدر السريري',gloves:'القفازات لا تستبدل نظافة اليدين.',dirty:'إذا كانت اليدان متسختين بوضوح: الماء والصابون.',switch:'انتبهي لنظافة اليدين عند الانتقال بين المهام.',observe:'اشرحي للمشرفة متى تنظفين يديك في السيناريو. التدريب العملي وتوثيقه منفصلان عن إنهاء القراءة.'},en:{sample:'Study sample · unapproved draft',back:'Back to library',prev:'Previous',next:'Next',finish:'Complete sample',step:'Step',of:'of',goal:'What will you learn?',idea:'The key idea',practice:'Try a decision',activity:'Practise with your supervisor',summary:'Your knowledge recap',question:'After removing gloves, you will open a clean drawer. What should happen before touching it?',choices:['Perform hand hygiene','Open it with the used gloves','Skip the step because the task is brief'],feedback:['Correct. Clean your hands before moving to clean instruments or surfaces.','Review the move from contaminated to clean tasks. Gloves do not replace hand hygiene.'],check:'Check my choice',pending:'Choose an option, then explore the explanation. This is learning practice, not an official assessment.',saved:'Your last sample step is saved on this device only. No information is sent to the platform.',disclaimer:'This draft requires clinical, translation and local-policy review. The sample creates no official result or competency credential.',done:'Well done — sample complete!',again:'Review this lesson again',open:'Start lesson',source:'Clinical source',gloves:'Gloves do not replace hand hygiene.',dirty:'Use soap and water for visibly soiled hands.',switch:'Notice hand-hygiene opportunities between tasks.',observe:'Explain when you would clean your hands in the scenario. Supervised practice and its documentation are separate from reading completion.'},ur:{sample:'تعلیمی نمونہ · غیر منظور شدہ مسودہ',back:'لائبریری میں واپس',prev:'پچھلا',next:'اگلا',finish:'نمونہ مکمل کریں',step:'مرحلہ',of:'از',goal:'آپ کیا سیکھیں گی؟',idea:'بنیادی خیال',practice:'فیصلہ کرنے کی مشق',activity:'سپروائزر کے ساتھ مشق',summary:'علمی خلاصہ',question:'دستانے اتارنے کے بعد آپ صاف دراز کھولیں گی۔ اسے چھونے سے پہلے کیا کریں؟',choices:['ہاتھ صاف کریں','استعمال شدہ دستانوں سے کھولیں','کام مختصر ہے اس لیے صفائی چھوڑ دیں'],feedback:['درست۔ صاف آلات یا سطح چھونے سے پہلے ہاتھ صاف کریں۔','آلودہ سے صاف کام کی طرف منتقلی دیکھیں۔ دستانے ہاتھوں کی صفائی کا متبادل نہیں۔'],check:'میرا جواب دیکھیں',pending:'جواب منتخب کریں، پھر وضاحت دیکھیں۔ یہ تعلیمی مشق ہے، رسمی امتحان نہیں۔',saved:'نمونے کا آخری مرحلہ صرف اس آلے پر محفوظ ہے۔ پلیٹ فارم کو معلومات نہیں بھیجی جاتیں۔',disclaimer:'اس مسودے کا طبی، لسانی اور مقامی پالیسی جائزہ ضروری ہے۔ کوئی رسمی نتیجہ یا عملی اہلیت نہیں ملتی۔',done:'بہت خوب، نمونہ مکمل!',again:'سبق دوبارہ دیکھیں',open:'سبق شروع کریں',source:'طبی ماخذ',gloves:'دستانے ہاتھوں کی صفائی کا متبادل نہیں۔',dirty:'واضح گندگی پر صابن اور پانی استعمال کریں۔',switch:'کام بدلتے وقت ہاتھ صاف کرنے کے مواقع پہچانیں۔',observe:'سپروائزر کو منظر میں ہاتھ صاف کرنے کا وقت بتائیں۔ عملی مشق اور ریکارڈ پڑھنے سے الگ ہیں۔'},id:{sample:'Contoh belajar · draf belum disetujui',back:'Kembali ke pustaka',prev:'Sebelumnya',next:'Berikutnya',finish:'Selesaikan contoh',step:'Langkah',of:'dari',goal:'Apa yang akan dipelajari?',idea:'Gagasan utama',practice:'Coba mengambil keputusan',activity:'Berlatih dengan supervisor',summary:'Ringkasan pengetahuan',question:'Setelah melepas sarung tangan, Anda akan membuka laci bersih. Apa yang dilakukan sebelum menyentuhnya?',choices:['Lakukan kebersihan tangan','Buka dengan sarung tangan bekas','Lewati karena tugasnya singkat'],feedback:['Benar. Bersihkan tangan sebelum beralih ke alat atau permukaan bersih.','Tinjau perpindahan dari tugas terkontaminasi ke tugas bersih. Sarung tangan bukan pengganti kebersihan tangan.'],check:'Periksa pilihan',pending:'Pilih jawaban, lalu baca penjelasan. Ini latihan belajar, bukan ujian resmi.',saved:'Langkah contoh terakhir disimpan hanya pada perangkat ini. Tidak ada data dikirim ke platform.',disclaimer:'Draf memerlukan tinjauan klinis, bahasa dan kebijakan lokal. Tidak menghasilkan nilai resmi atau sertifikat kompetensi.',done:'Bagus — contoh selesai!',again:'Tinjau pelajaran lagi',open:'Mulai pelajaran',source:'Sumber klinis',gloves:'Sarung tangan tidak menggantikan kebersihan tangan.',dirty:'Gunakan sabun dan air bila tangan tampak kotor.',switch:'Kenali waktu kebersihan tangan saat berpindah tugas.',observe:'Jelaskan kapan Anda membersihkan tangan kepada supervisor. Praktik terawasi dan pencatatannya terpisah dari menyelesaikan bacaan.'}};
const icon='<div class="visual" role="img" aria-label="Learning illustration"><svg viewBox="0 0 260 170" fill="none" aria-hidden="true"><circle cx="125" cy="85" r="70" fill="#deefd6"/><rect x="151" y="45" width="53" height="90" rx="13" fill="white" stroke="#a5c9a0" stroke-width="3"/><path d="M164 44V33h25v12m-11-11V22h31" stroke="#398858" stroke-width="6" stroke-linecap="round"/><path d="M52 111c22-19 28-31 41-25l29 11 22-5c14-4 22 12 9 19l-30 15H80" fill="#8dc69b" stroke="#398858" stroke-width="3"/><path d="m68 74 15 7m9-30 8 17m28-24-4 18" stroke="#72af80" stroke-width="5" stroke-linecap="round"/><circle cx="195" cy="103" r="21" fill="#398858"/><path d="m185 104 7 6 12-15" stroke="white" stroke-width="4" stroke-linecap="round"/></svg></div>';
function save(){try{localStorage.setItem('nse-study-sample',JSON.stringify({step,done}))}catch{}}
function element(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
function render(){const tr=T[lang],data=lesson.translations[lang];document.documentElement.lang=lang;document.documentElement.dir=['ar','ur'].includes(lang)?'rtl':'ltr';$('language').value=lang;$('sampleLabel').textContent=tr.sample;$('backLibrary').textContent=tr.back;$('previous').textContent=tr.prev;$('next').textContent=step===4?tr.finish:tr.next;$('stepText').textContent=tr.step+' '+(step+1)+' '+tr.of+' 5';$('fill').style.width=(step+1)*20+'%';$('previous').disabled=step===0;$('disclaimer').textContent=tr.disclaimer;$('saved').textContent=tr.saved;$('navigation').hidden=false;const root=$('screen');root.replaceChildren(element('span','INFECTION PREVENTION · 6 MIN','eyebrow'));root.append(element('h1',[tr.goal,tr.idea,tr.practice,tr.activity,tr.summary][step]));$('dots').replaceChildren(...Array.from({length:5},(_,i)=>element('span','','dot'+(i<=step?' active':''))));
if(step===0){root.insertAdjacentHTML('beforeend',icon);root.append(element('h2',data.title),element('p',data.objective));const tip=element('div',tr.gloves,'callout');root.append(tip)}
if(step===1){const parts=data.body.split('\n\n');root.append(element('p',parts[1].split('\n').slice(1).join('\n')));root.append(element('div',tr.dirty,'callout'));root.insertAdjacentHTML('beforeend',icon)}
if(step===2){root.append(element('h2',tr.question),element('p',tr.pending,'muted'));tr.choices.forEach((x,i)=>{const b=element('button',x,'choice'+(choice===i?' selected':''));b.setAttribute('aria-pressed',String(choice===i));b.onclick=()=>{choice=i;render()};root.append(b)});const check=element('button',tr.check,'primary');check.disabled=choice===null;check.onclick=()=>{let f=$('feedback');if(!f){f=element('div','','feedback');f.id='feedback';f.setAttribute('aria-live','polite');root.append(f)}f.textContent=tr.feedback[choice===0?0:1]};root.append(check)}
if(step===3){root.append(element('p',data.activity),element('div',tr.observe,'callout'));root.insertAdjacentHTML('beforeend',icon)}
if(step===4){const card=element('article','','knowledge');card.append(element('span','NSE · KNOWLEDGE RECAP','label'),element('h2',data.title));const list=document.createElement('ul');[tr.gloves,tr.dirty,tr.switch].forEach(x=>list.append(element('li',x)));card.append(list);root.append(card);const a=element('a',tr.source+' ↗');a.href=lesson.sourceUrls[0];a.target='_blank';a.rel='noopener';root.append(a);root.append(element('p',tr.disclaimer,'muted'))}save();}
function library(){const tr=T[lang];$('navigation').hidden=true;$('screen').replaceChildren(element('h1',lang==='ar'?'مكتبتي التعليمية':'Learning library'));const tile=element('div','','course-tile');const title=element('div');title.append(element('strong',lesson.translations[lang].title),element('p',(done?'✓ ':'')+(done?tr.done:tr.step+' '+(step+1)+' '+tr.of+' 5'),'muted'));const b=element('button',done?tr.again:tr.open,'primary');b.onclick=()=>{if(done){done=false;step=0}render()};tile.append(title,b);$('screen').append(tile)}
$('previous').onclick=()=>{if(step>0){step--;render()}};$('next').onclick=()=>{if(step<4){step++;render()}else{done=true;save();$('navigation').hidden=true;$('screen').replaceChildren(element('div','✓','seal center'),element('h1',T[lang].done),element('p',T[lang].disclaimer));const b=element('button',T[lang].back,'primary');b.onclick=library;$('screen').append(b)}};$('backLibrary').onclick=library;$('language').onchange=()=>{lang=$('language').value;render()};render();
</script></body></html>
